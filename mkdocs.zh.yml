# Traditional Chinese site, served at /ipro-sdk-docs/.
# Keep nav entries in the same order and files as mkdocs.en.yml (tools/parity_check.py).
INHERIT: mkdocs.base.yml
site_url: https://intelpro-inc.github.io/ipro-sdk-docs/
site_description: INTELPRO IPRO SDK 開發文件
docs_dir: docs/zh
site_dir: site

theme:
  language: zh-TW

plugins:
  - search:
      lang: en
      # Material fallback only: jieba segments Chinese at build time and joins
      # words with U+200B. Zensical uses its own search and ignores these.
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  # Sidebar marker for pages whose front matter says status: stub
  status:
    stub: "待遷移：內容尚未從舊站搬過來"
  notice: "本文件對應 IPRO SDK {sdk}（{date}）。"
  alternate:
    - { name: 繁體中文, link: /ipro-sdk-docs/, lang: zh-TW }
    - { name: English, link: /ipro-sdk-docs/en/, lang: en }

