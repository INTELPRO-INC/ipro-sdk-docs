# Simplified Chinese site, served at /ipro-sdk-docs/zh-cn/.
# Keep nav entries in the same order and files as mkdocs.zh.yml (tools/parity_check.py).
INHERIT: mkdocs.base.yml
site_url: https://intelpro-inc.github.io/ipro-sdk-docs/zh-cn/
site_description: INTELPRO IPRO SDK 开发文档
docs_dir: docs/zh-cn
site_dir: site/zh-cn

theme:
  language: zh

plugins:
  - search:
      lang: en
      # Material fallback only; Zensical uses its own search and ignores these.
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  # Sidebar marker for pages whose front matter says status: stub
  status:
    stub: "待迁移：内容尚未从旧站搬过来"
  notice: "本文档对应 IPRO SDK {sdk}（{date}）。"
  alternate:
    - { name: 繁體中文, link: /ipro-sdk-docs/, lang: zh-TW }
    - { name: English, link: /ipro-sdk-docs/en/, lang: en }
    - { name: 简体中文, link: /ipro-sdk-docs/zh-cn/, lang: zh-CN }
    - { name: 日本語, link: /ipro-sdk-docs/ja/, lang: ja }

