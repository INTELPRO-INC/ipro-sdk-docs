# Taiwan terminology for zh-TW pages (docs/zh/), checked by tools/redline_check.py.
# term: the wording to avoid; use: the Taiwan form. severity defaults to error;
# use warning where the term is right in some contexts. pattern (regex) overrides
# the literal match, e.g. to skip 「額外設定」 when checking 外設.
