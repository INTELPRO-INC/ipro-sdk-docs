name: docs

on:
  push:
    branches: [main, redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (parity, red-line, migration, tool tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tool tests
        run: python -m pytest tools/tests -q
      - name: zh / en parity
        run: python tools/parity_check.py
      - name: Red-line check
        # Private rules come from the REDLINE_RULES secret; matches print no text.
        env:
          REDLINE_RULES: ${{ secrets.REDLINE_RULES }}
        run: python tools/redline_check.py
      - name: Migration report
        # Stubs block main only; on other branches the report is informational.
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            python tools/stub_report.py --fail-on-stubs --fail-on-uncovered
          else
            python tools/stub_report.py --fail-on-uncovered
          fi

  build:
    name: Build (Zensical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./tools/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  build-material:
    # Fallback builder: keeps the sources buildable with Material for MkDocs,
    # and catches pages missing from the nav (Zensical does not report them).
    name: Build (Material fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ENGINE=material ./tools/build.sh

  deploy:
    # Requires Settings → Pages → Source = "GitHub Actions" (switched at cutover).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build, build-material]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
