<text x="541.0" y="393.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">声紋を計算</text>
<rect x="682" y="304" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="807.0" y="364.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">ボードの Flash に保存、</text>
<text x="807.0" y="393.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">再起動は不要</text>
