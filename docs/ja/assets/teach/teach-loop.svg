<text x="1073.0" y="393.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">1 秒に 1 つ表示</text>
<rect x="10" y="452" width="128" height="136" rx="10" fill="#316200" stroke="#316200" stroke-width="2"/>
<text x="74.0" y="535.0" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">センサー</text>

<rect x="150" y="452" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="275.0" y="498.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">状態ごとに押し続けて</text>
<text x="275.0" y="527.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">記録。模擬センサーは</text>
<text x="275.0" y="556.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">1 クラス 10～30 秒</text>
<rect x="416" y="452" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="541.0" y="498.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">小さな CNN を</text>
<text x="541.0" y="527.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">PC で学習：</text>
<text x="541.0" y="556.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">数秒～約 90 秒</text>
<rect x="682" y="452" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="807.0" y="512.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">mfg パーティションに</text>
<text x="807.0" y="541.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">書き込み、再起動</text>
<rect x="948" y="452" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="1073.0" y="512.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">1 秒に 4 回判定、</text>
<text x="1073.0" y="541.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">RGB LED にクラス表示</text>
