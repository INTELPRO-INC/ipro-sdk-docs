<rect x="416" y="14" width="250" height="118" rx="10" fill="#eef3ee" stroke="#3d5a45" stroke-width="2"/>
<text x="541.0" y="54.4" font-size="24" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">学習</text>
<text x="541.0" y="81.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">PC 上の</text>
<text x="541.0" y="108.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">IPRO AI Studio で</text>
