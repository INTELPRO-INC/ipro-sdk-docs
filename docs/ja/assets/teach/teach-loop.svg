<text x="807.0" y="108.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">ボードの Flash へ</text>
