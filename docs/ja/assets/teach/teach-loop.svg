<text x="807.0" y="231.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">ボードは自動的に</text>
<text x="807.0" y="260.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Hiragino Sans','Noto Sans JP','Heiti TC',sans-serif">再起動</text>
