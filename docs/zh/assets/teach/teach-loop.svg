<text x="1073.0" y="393.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">顯示在電腦畫面上</text>
<rect x="10" y="452" width="128" height="136" rx="10" fill="#316200" stroke="#316200" stroke-width="2"/>
