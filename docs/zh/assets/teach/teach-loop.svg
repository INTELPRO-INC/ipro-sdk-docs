<text x="541.0" y="81.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">IPRO AI Studio</text>
<text x="541.0" y="108.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif"></text>
