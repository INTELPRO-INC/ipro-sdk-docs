<text x="541.0" y="527.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">在電腦上訓練，</text>
<text x="541.0" y="556.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">數秒到約 90 秒</text>
