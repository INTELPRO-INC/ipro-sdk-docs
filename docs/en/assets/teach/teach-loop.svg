<text x="807.0" y="512.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">Written to the mfg</text>
<text x="807.0" y="541.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">partition; restarts</text>
<rect x="948" y="452" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="1073.0" y="512.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">4 results a second;</text>
<text x="1073.0" y="541.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">RGB LED shows class</text>
