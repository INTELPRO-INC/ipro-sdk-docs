<text x="807.0" y="81.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">over the same USB-C,</text>
<text x="807.0" y="108.4" font-size="19" text-anchor="middle" fill="#4b5563" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">into the board's flash</text>
