<text x="807.0" y="393.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">flash; no restart</text>
<rect x="948" y="304" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="1073.0" y="364.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">One speaker label</text>
<text x="1073.0" y="393.5" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">a second on the PC</text>
