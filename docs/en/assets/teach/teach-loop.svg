<text x="275.0" y="527.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">state: 10–30 s per</text>
<text x="275.0" y="556.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">simulated class</text>
<rect x="416" y="452" width="250" height="136" rx="8" fill="#ffffff" stroke="#c9d3c9" stroke-width="1.5"/>
<text x="541.0" y="498.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">A small CNN trained</text>
<text x="541.0" y="527.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">on the PC, from</text>
<text x="541.0" y="556.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="'Helvetica Neue',Helvetica,'Heiti TC',sans-serif">seconds to about 90 s</text>
