# Formal documents listed on documents/index.md. Run tools/gen_documents.py after editing.
#   access: request  -> "available from INTELPRO on request"
#   access: public   -> download links from files (one URL per language, e.g. a GitHub Release asset)
# Before setting a document public, check it against the customer-facing wording rules.
page:
  title: {zh: "文件下載", en: "Documents", zh-cn: "文档下载", ja: "ドキュメント"}
  description:
    zh: IPRO7／IPRO7AI 正式晶片、軟體與開發板文件清單，含版本、語言與涵蓋內容。
    en: The formal IPRO7 / IPRO7AI chip, software and board documents, with version, languages and contents.
    zh-cn: IPRO7／IPRO7AI 正式芯片、软件与开发板文档清单，含版本、语言与涵盖内容。
    ja: IPRO7／IPRO7AI のチップ、ソフトウェア、ボードに関する正式ドキュメントの一覧（バージョン、言語、内容）。
  intro:
    zh: INTELPRO 為 IPRO7 與 IPRO7AI 提供的正式文件，對應 SDK V2.1 與 IPRO AI Teach 2.0。各文件提供的語言列於表中。
    en: The formal documents INTELPRO provides for IPRO7 and IPRO7AI, matching SDK V2.1 and IPRO AI Teach 2.0. The languages of each document are listed in the table.
    zh-cn: INTELPRO 为 IPRO7 与 IPRO7AI 提供的正式文档，对应 SDK V2.1 与 IPRO AI Teach 2.0。各文档提供的语言列于表中。
    ja: INTELPRO が IPRO7 と IPRO7AI 向けに提供している正式ドキュメントです。SDK V2.1 と IPRO AI Teach 2.0 に対応しています。各ドキュメントの提供言語は表に記載しています。
  request_notice:
    zh: 標示「向 INTELPRO 索取」的文件，請向 INTELPRO 索取，並註明文件名稱、版本與語言。
    en: For documents marked "On request", contact INTELPRO and name the document, version and language.
    zh-cn: 标注“向 INTELPRO 索取”的文档，请向 INTELPRO 索取，并注明文档名称、版本与语言。
    ja: 「INTELPRO にお問い合わせください」と記載されたドキュメントは、ドキュメント名、バージョン、言語を明記のうえ INTELPRO にお問い合わせください。
  outro:
    zh: 板卡的上手步驟見 [IPRO7AI Reef EVK](../hardware/boards/reef-evk.md)，SDK 的 API 索引見 [API 參考](../reference/api/index.md)。
    en: For board bring-up steps see [IPRO7AI Reef EVK](../hardware/boards/reef-evk.md); for the SDK's API index see [API Reference](../reference/api/index.md).
    zh-cn: 开发板的上手步骤见 [IPRO7AI Reef EVK](../hardware/boards/reef-evk.md)，SDK 的 API 索引见 [API 参考](../reference/api/index.md)。
    ja: ボードの立ち上げ手順は [IPRO7AI Reef EVK](../hardware/boards/reef-evk.md)、SDK の API 索引は [API リファレンス](../reference/api/index.md) を参照してください。
categories:
