          zh-cn: "系统与内存、复位与时钟，以及 GPIO、ADC、DMA、SPI、UART、I2C、PWM、定时器、音频 ADC、KeyScan、低功耗、安全引擎与 MJPEG 的寄存器"
          ja: "システムとメモリ、リセットとクロック、および GPIO、ADC、DMA、SPI、UART、I2C、PWM、タイマー、オーディオ ADC、KeyScan、低消費電力、セキュリティエンジン、MJPEG のレジスター"
        access: request
        files: {}
