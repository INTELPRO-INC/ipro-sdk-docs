# Formal documents listed on documents/index.md. Run tools/gen_documents.py after editing.
#   access: request  -> "available from INTELPRO on request"
#   access: public   -> download links from files (one URL per language, e.g. a GitHub Release asset)
# Before setting a document public, check it against the customer-facing wording rules.
page:
  title: {zh: "文件下載", en: "Documents"}
  description:
    zh: IPRO7／IPRO7AI 正式晶片、軟體與開發板文件清單，含版本、語言與涵蓋內容。
    en: The formal IPRO7 / IPRO7AI chip, software and board documents, with version, languages and contents.
  intro:
    zh: INTELPRO 為 IPRO7 與 IPRO7AI 提供的正式文件，對應 SDK V2.1。每份文件都有繁體中文與英文版。
    en: The formal documents INTELPRO provides for IPRO7 and IPRO7AI, matching SDK V2.1. Every document is available in Traditional Chinese and English.
  request_notice:
    zh: 標示「向 INTELPRO 索取」的文件，請向 INTELPRO 索取，並註明文件名稱、版本與語言。
    en: For documents marked "On request", contact INTELPRO and name the document, version and language.
  outro:
    zh: 板卡的上手步驟見 [IPRO7AI Reef EVK](../hardware/boards/reef-evk.md)，SDK 的 API 索引見 [API 參考](../reference/api/index.md)。
    en: For board bring-up steps see [IPRO7AI Reef EVK](../hardware/boards/reef-evk.md); for the SDK's API index see [API Reference](../reference/api/index.md).
categories:
  - id: chip-documents
    title: {zh: "晶片文件", en: "Chip documents"}
    documents:
      - id: ipro7-product-brief
        title: {zh: "IPRO7 產品簡介", en: "IPRO7 Product Brief"}
        version: V1.0
        languages: [zh-TW, en]
        summary:
          zh: "功能概要、方塊圖、目標應用、封裝與訂購資訊"
          en: "Feature overview, block diagram, target applications, package and ordering information"
        access: request
        files: {}
      - id: ipro7-datasheet
        title: {zh: "IPRO7 資料手冊", en: "IPRO7 Datasheet"}
        version: V1.6
        languages: [zh-TW, en]
        summary:
          zh: "功能描述、腳位定義與 GPIO 腳位多工、AI／NPU、電氣規格、標記與訂購資訊"
          en: "Functional description, pin definitions and GPIO pin multiplexing, AI / NPU, electrical specifications, marking and ordering information"
        access: request
        files: {}
      - id: ipro7-reference-manual
        title: {zh: "IPRO7 暫存器參考手冊", en: "IPRO7 Reference Manual"}
        version: V1.3
        languages: [zh-TW, en]
        summary:
          zh: "系統與記憶體、重置與時脈，以及 GPIO、ADC、DMA、SPI、UART、I2C、PWM、計時器、音訊 ADC、KeyScan、低功耗、安全引擎與 MJPEG 的暫存器"
          en: "System and memory, reset and clocks, and the registers of GPIO, ADC, DMA, SPI, UART, I2C, PWM, timers, audio ADC, KeyScan, low power, the security engine and MJPEG"
        access: request
        files: {}
      - id: ipro7-hardware-design-guide
        title: {zh: "IPRO7 硬體設計指南", en: "IPRO7 Hardware Design Guide"}
        version: V1.1
        languages: [zh-TW, en]
        summary:
          zh: "SoC 硬體參考，以及電源、PCB 佈線、時脈電路、開機模式與 strap 腳、介面參考設計、封裝 footprint 與 SoM 參考設計"
          en: "SoC hardware reference, plus power, PCB routing, clock circuits, boot mode and strap pins, interface reference designs, package footprint and the SoM reference design"
        access: request
        files: {}
      - id: ipro7-application-note-power-up-verification
        title: {zh: "IPRO7 應用說明：電源上電驗證", en: "IPRO7 Application Note: Power-up Verification"}
        version: V1.1
        languages: [zh-TW, en]
        summary:
          zh: "電源架構與上電順序、測試點、量測步驟與驗收標準、檢查表"
          en: "Power architecture and power-on sequence, test points, measurement procedure and acceptance criteria, checklist"
        access: request
        files: {}
