# Old Jekyll URLs to new pages, for tools/gen_redirects.py.
#
# Each key is a page of the old site (legacy/<key>.html), served as <key>.html
# and en/<key>.html; the same entry covers both languages. `to` is where the
# old page now lives. `anchors` sends an old section (#id) somewhere else.
#
# A target without "#" keeps the old section id when the target page has a
# heading with that id, so sections whose ids survived the rewrite need no
# entry. A target ending in a bare "#" always lands at the top of its page.
# Any other old section lands at the top of `to`.
