# API reference groups for tools/gen_api.py.
# Each group becomes reference/api/<id>.md; headers are paths as Doxygen reports
# them (relative to the SDK root). Every header in the Doxygen XML must be listed
# in exactly one group or under `exclude`, so new headers are never dropped silently.
exclude:
  # GPL-2.0 licensed MII register header; kept out of the public reference until decided.
  - bsp/hal/inc/mii.h
  # IPRO7AI EVK board library: the site documents the IPRO7AI Reef EVK only (since V2.2.0).
  - components/board/ipro7ai_evk/include/evk.h
  - components/board/ipro7ai_evk/include/st7789p3.h
  - components/board/ipro7ai_evk/include/st7789p3_port.h
  - components/board/ipro7ai_evk/include/evk_gfx.h
  - components/board/ipro7ai_evk/include/font5x7.h
  - components/board/ipro7ai_evk/include/evk_cam.h
  - components/board/ipro7ai_evk/include/evk_cam_port.h
  - components/board/ipro7ai_evk/include/evk_mic.h
  - components/board/ipro7ai_evk/include/evk_spk.h
  - components/board/ipro7ai_evk/include/evk_audio_port.h
  - components/board/ipro7ai_evk/include/evk_pcm.h
  - components/board/ipro7ai_evk/include/evk_sd.h
groups:
  - id: platform
    title: {zh: 平台與系統, en: Platform & System, zh-cn: 平台与系统, ja: プラットフォームとシステム}
    summary:
      zh: FreeRTOS 啟動與掛鉤、HAL 共用定義、系統控制、時脈、計時器、看門狗、RTC 與記憶體配置輔助。
      en: FreeRTOS start-up and hooks, common HAL definitions, system control, clocks, timers, watchdogs, RTC and memory helpers.
      zh-cn: FreeRTOS 启动与钩子、HAL 公共定义、系统控制、时钟、定时器、看门狗、RTC 与内存分配辅助。
      ja: FreeRTOS の起動とフック、HAL の共通定義、システム制御、クロック、タイマー、ウォッチドッグ、RTC、メモリ割り当ての補助。
    headers:
      - components/os/freertos/freertos_app_hooks.h
      - bsp/hal/inc/hal_common.h
      - bsp/hal/inc/hal_sys.h
      - bsp/hal/inc/hal_clock.h
      - bsp/hal/inc/hal_mtimer.h
      - bsp/hal/inc/hal_timer.h
      - bsp/hal/inc/hal_rtc.h
      - bsp/hal/inc/hal_wdt.h
      - bsp/hal/inc/hal_aon_wdt.h
      - bsp/hal/inc/hal_cache_alloc.h
      - bsp/hal/inc/hal_hbnram_mgnt.h
  - id: memory-boot
    title: {zh: 記憶體、Flash 與開機, en: "Memory, Flash & Boot", zh-cn: 内存、Flash 与启动, ja: メモリ、Flash、ブート}
    summary:
      zh: Flash 讀寫、PSRAM、boot2 與分割表管理。
      en: Flash access, PSRAM, boot2 and the partition table manager.
      zh-cn: Flash 读写、PSRAM、boot2 与分区表管理。
      ja: Flash の読み書き、PSRAM、boot2、パーティションテーブルの管理。
    headers:
      - bsp/hal/inc/hal_flash.h
      - bsp/hal/inc/hal_psram.h
      - bsp/hal/inc/hal_sf_psram.h
      - bsp/hal/inc/hal_boot2.h
      - bsp/hal/inc/hal_ptmgr.h
  - id: power
