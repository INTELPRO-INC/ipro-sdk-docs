            3. **執行**：以 **921600** baud 開啟主控台。開機印出 `ipro7_jpeg_decode: JPEG -> RGB565 / RGB888, ...`；輸入 `jdec run all`，最後一行為 `... failed -> ALL PASS`。`jdec list` 列出測試圖與預期結果。

            </div>
          en: |
            This is the only Reef configuration with its console at 921600 baud.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef
                ```

                The image is `apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin`, with the test images linked in.

            2. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at **921600** baud. The board prints `ipro7_jpeg_decode: JPEG -> RGB565 / RGB888, ...`; type `jdec run all` and the last line reads `... failed -> ALL PASS`. `jdec list` lists the test images and what is expected of each.

            </div>
          zh-cn: |
            这是 Reef 配置中唯一控制台为 921600 baud 的应用。

            <div class="ipro-steps" markdown>

            1. **构建**

                ```bash
                make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef
                ```

                镜像位于 `apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin`，测试图已链接在内。

            2. **烧录**：进入[下载模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目录执行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin
                ```

                确认 `[All Success]` 后按一下 SW2。

            3. **运行**：以 **921600** baud 打开控制台。开机打印 `ipro7_jpeg_decode: JPEG -> RGB565 / RGB888, ...`；输入 `jdec run all`，最后一行为 `... failed -> ALL PASS`。`jdec list` 列出测试图与预期结果。

            </div>
          ja: |
            Reef 構成の中で、コンソールが 921600 baud なのはこのアプリケーションだけです。

            <div class="ipro-steps" markdown>

            1. **ビルド**

                ```bash
                make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef
                ```

                イメージは `apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin` で、テスト画像もリンクされています。

            2. **書き込み**：[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)に入り、IntelProCube のディレクトリで次を実行します。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin
                ```

                `[All Success]` を確認してから SW2 を押します。

            3. **実行**：**921600** baud でコンソールを開きます。ボードは `ipro7_jpeg_decode: JPEG -> RGB565 / RGB888, ...` を表示します。`jdec run all` と入力すると、最終行は `... failed -> ALL PASS` になります。`jdec list` はテスト画像と、それぞれの期待される結果を一覧表示します。

            </div>
      - name: ipro_ai_link
        path: apps/test/ipro_ai_link
        purpose:
          zh: "IPRO AI Studio「Run on board」的板端韌體：由 microSD（`sd:/`）載入 `.inm` 模型與輸入、在 NPU 上推論、輸出原始結果；也可在主控台手動操作"
          en: "Board firmware for IPRO AI Studio \"Run on board\": loads `.inm` models and inputs from microSD (`sd:/`), runs them on the NPU and prints the raw outputs; also usable by hand from the console"
          zh-cn: "IPRO AI Studio“Run on board”的板端固件：从 microSD（`sd:/`）加载 `.inm` 模型与输入、在 NPU 上推理、输出原始结果；也可在控制台手动操作"
          ja: "IPRO AI Studio の「Run on board」用ボード側ファームウェア：microSD（`sd:/`）から `.inm` モデルと入力を読み込み、NPU で実行して生の出力を表示します。コンソールから手動でも操作できます"
        boards:
          zh: "Reef（`defconfig_reef`）；`.config` 為 IPRO7 EVB"
          en: "Reef (`defconfig_reef`); `.config` targets the IPRO7 EVB"
          zh-cn: "Reef（`defconfig_reef`）；`.config` 对应 IPRO7 EVB"
          ja: "Reef（`defconfig_reef`）、`.config` は IPRO7 EVB 用"
        console:
          zh: "UART 115200（另有 USB CDC 主控台）"
          en: "UART 115200 (also on a USB CDC port)"
          zh-cn: "UART 115200（另有 USB CDC 控制台）"
          ja: "UART 115200（USB CDC ポートでも使用可）"
        build:
          zh: "Reef：`make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef`"
          zh-cn: "Reef：`make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef`"
          ja: "Reef：`make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef`"
        readme: {exclude: true}   # no README in the release
        reef:
          zh: |
            這個應用沒有 README，以下依原始碼整理。需要一張 FAT 格式的 microSD 卡。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin`。

            2. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            3. **執行**：以 115200 baud 開啟主控台，開機印出 `ipro_ai_link ready`。USB-C 接上電腦時，板子出現為兩個 CDC 序列埠（VID `0x3896`、PID `0x0704`）：第一個傳資料，第二個是主控台。

            4. **手動推論**：把 `.inm` 模型與原始輸入檔複製到 SD 卡，插入卡座後依序輸入

                ```text
                ai_mount
                ai_load sd:/model.inm
                ai_input sd:/input.bin
                ai_run
                ai_out
                ```

                `ai_out` 以十六進位印出輸出張量，每個位元組都以 XOR 0x80 儲存。路徑一律以 `sd:/` 開頭。

            </div>

            SDK 隨附可用的模型，例如 `apps/platform/ipro7_demo/demo/ai/ai_model/mbv2.inm`。IPRO AI Studio 可從 [GitHub](https://github.com/INTELPRO-INC/ipro-ai-studio/releases/latest) 下載。
          en: |
            This application has no README; the steps below follow its source. You need a FAT-formatted microSD card.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef
                ```

                The image is `apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin`.

            2. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at 115200 baud; the board prints `ipro_ai_link ready`. On a computer's USB port the board shows up as two CDC serial ports (VID `0x3896`, PID `0x0704`): the first carries data, the second is a console.

            4. **Run a model by hand**: copy an `.inm` model and a raw input file to the SD card, insert it, then type

                ```text
                ai_mount
                ai_load sd:/model.inm
                ai_input sd:/input.bin
                ai_run
                ai_out
                ```

                `ai_out` prints the output tensor in hex, every byte stored XOR 0x80. Paths always start with `sd:/`.

            </div>

            The SDK ships models to try, for example `apps/platform/ipro7_demo/demo/ai/ai_model/mbv2.inm`. Download IPRO AI Studio from [GitHub](https://github.com/INTELPRO-INC/ipro-ai-studio/releases/latest).
          zh-cn: |
            这个应用没有 README，以下根据源代码整理。需要一张 FAT 格式的 microSD 卡。

            <div class="ipro-steps" markdown>

            1. **构建**

                ```bash
                make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef
                ```

                镜像位于 `apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin`。

            2. **烧录**：进入[下载模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目录执行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin
                ```

                确认 `[All Success]` 后按一下 SW2。

            3. **运行**：以 115200 baud 打开控制台，开机打印 `ipro_ai_link ready`。USB-C 连接电脑时，开发板显示为两个 CDC 串口（VID `0x3896`、PID `0x0704`）：第一个传输数据，第二个是控制台。

            4. **手动推理**：把 `.inm` 模型与原始输入文件复制到 SD 卡，插入卡座后依次输入

                ```text
                ai_mount
                ai_load sd:/model.inm
                ai_input sd:/input.bin
                ai_run
                ai_out
                ```

                `ai_out` 以十六进制打印输出张量，每个字节都以 XOR 0x80 存储。路径一律以 `sd:/` 开头。

            </div>

            SDK 随附可用的模型，例如 `apps/platform/ipro7_demo/demo/ai/ai_model/mbv2.inm`。IPRO AI Studio 可从 [GitHub](https://github.com/INTELPRO-INC/ipro-ai-studio/releases/latest) 下载。
          ja: |
            このアプリケーションには README がないため、以下の手順はソースコードに基づいています。FAT でフォーマットした microSD カードが必要です。

            <div class="ipro-steps" markdown>

            1. **ビルド**

                ```bash
                make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef
                ```

                イメージは `apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin` です。

            2. **書き込み**：[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)に入り、IntelProCube のディレクトリで次を実行します。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin
                ```

                `[All Success]` を確認してから SW2 を押します。

            3. **実行**：115200 baud でコンソールを開くと、ボードが `ipro_ai_link ready` を表示します。コンピューターの USB ポートに接続すると、ボードは 2 つの CDC シリアルポート（VID `0x3896`、PID `0x0704`）として認識されます。1 つ目はデータ用、2 つ目はコンソールです。

            4. **モデルを手動で実行**：`.inm` モデルと生の入力ファイルを SD カードにコピーして挿入し、次のように入力します。

                ```text
                ai_mount
                ai_load sd:/model.inm
                ai_input sd:/input.bin
                ai_run
                ai_out
                ```

                `ai_out` は出力テンソルを 16 進数で表示します。各バイトは XOR 0x80 で格納されています。パスは必ず `sd:/` で始めます。

            </div>

            SDK には試せるモデルが付属しています（例：`apps/platform/ipro7_demo/demo/ai/ai_model/mbv2.inm`）。IPRO AI Studio は [GitHub](https://github.com/INTELPRO-INC/ipro-ai-studio/releases/latest) からダウンロードできます。
      - name: ipro_agora_sentino
        path: apps/multimedia/ipro_agora_sentino
        purpose:
          zh: "Sentino 雲端 AI 語音對話：BLE 配網、經 IPRO6S FIN 卡連 Wi-Fi、MQTT 登入、Agora RTC 即時語音；需另備 Sentino 裝置三元組與 AOSL 核心"
          en: "Sentino cloud AI voice chat: BLE provisioning, Wi-Fi through the IPRO6S FIN card, MQTT login and Agora RTC voice; needs a Sentino device triple and the AOSL core"
          zh-cn: "Sentino 云端 AI 语音对话：BLE 配网、经 IPRO6S FIN 卡连接 Wi-Fi、MQTT 登录、Agora RTC 实时语音；需另备 Sentino 设备三元组与 AOSL 核心"
          ja: "Sentino クラウド AI 音声対話：BLE によるプロビジョニング、IPRO6S FIN カード経由の Wi-Fi、MQTT ログイン、Agora RTC 音声。Sentino デバイストリプルと AOSL コアが別途必要です"
        boards:
          zh: "Reef＋IPRO6S FIN 卡（`.config`，`make` 或 `make BOARD=reef`）；`BOARD=evk` 為 IPRO7AI EVK（可建置，未經板上驗證）"
          en: "Reef + IPRO6S FIN card (`.config`, `make` or `make BOARD=reef`); `BOARD=evk` targets the IPRO7AI EVK (builds, not verified on a board)"
          zh-cn: "Reef＋IPRO6S FIN 卡（`.config`，`make` 或 `make BOARD=reef`）；`BOARD=evk` 对应 IPRO7AI EVK（可构建，未经板上验证）"
          ja: "Reef＋IPRO6S FIN カード（`.config`、`make` または `make BOARD=reef`）、`BOARD=evk` は IPRO7AI EVK 用（ビルドは可能、ボード上では未検証）"
        console:
          zh: "Reef：UART 115200"
          en: "Reef: UART 115200"
          zh-cn: "Reef：UART 115200"
          ja: "Reef：UART 115200"
        reef:
          zh: |
            需要：插在 microSD 卡座、執行 `ipro6_if_wifi`（`defconfig_ipro6_sdio`）韌體的 IPRO6S FIN 卡，JP3 在 GPIO；接在喇叭座的喇叭；每塊板一組 Sentino 裝置三元組與 Sentino 手機 App（向 Sentino 取得，不隨 SDK 提供）；可連網際網路的 2.4 GHz 基地台。

            <div class="ipro-steps" markdown>

            1. **取得 AOSL 核心**（只需一次，SDK 不含）：在 SDK 根目錄執行

                ```bash
                git clone https://github.com/AgoraIO-Community/aosl components/3rdparty/agora/aosl
                git -C components/3rdparty/agora/aosl checkout d825607
                ```

                缺少這個目錄時，建置會停下並印出這兩行指令。

            2. **建置**

                ```bash
                make -C apps/multimedia/ipro_agora_sentino
                ```

                映像在 `apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin`。

            3. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            4. **設定與執行**：以 115200 baud 開啟主控台，開機印出 `IPRO7 Agora Sentino AI Gateway`。輸入 `sentino_triple set <pid> <uuid> <secret>` 後 `reboot`。板子以 BLE 名稱 `RY` 廣播，以 Sentino 手機 App 送出 IPRO6S FIN 卡的 Wi-Fi 設定與伺服器設定（或在主控台輸入 `wifi_set <ssid> <psk>`）；登入後即可對著麥克風與 AI 對話。

            </div>
          en: |
            You need: an IPRO6S FIN card in the microSD slot running the `ipro6_if_wifi` firmware (`defconfig_ipro6_sdio`), with JP3 on GPIO; a speaker on the speaker connector; a Sentino device triple per board and the Sentino phone app (from Sentino, not part of the SDK); a 2.4 GHz access point with internet access.

            <div class="ipro-steps" markdown>

            1. **Get the AOSL core** (once; not part of the SDK). From the SDK root:

                ```bash
                git clone https://github.com/AgoraIO-Community/aosl components/3rdparty/agora/aosl
                git -C components/3rdparty/agora/aosl checkout d825607
                ```

                Without this directory the build stops and prints these two commands.

            2. **Build**

                ```bash
                make -C apps/multimedia/ipro_agora_sentino
                ```

                The image is `apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin`.

            3. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            4. **Set up and run**: open the console at 115200 baud; the board prints `IPRO7 Agora Sentino AI Gateway`. Type `sentino_triple set <pid> <uuid> <secret>`, then `reboot`. The board advertises over BLE as `RY`; send the Wi-Fi settings for the IPRO6S FIN card and the server settings from the Sentino phone app (or type `wifi_set <ssid> <psk>` at the console). Once logged in, talk to the AI through the microphone.

            </div>
          zh-cn: |
            需要：插在 microSD 卡座、运行 `ipro6_if_wifi`（`defconfig_ipro6_sdio`）固件的 IPRO6S FIN 卡，JP3 置于 GPIO；接在扬声器座上的扬声器；每块开发板一组 Sentino 设备三元组与 Sentino 手机 App（向 Sentino 获取，不随 SDK 提供）；可连接互联网的 2.4 GHz 无线接入点。

            <div class="ipro-steps" markdown>

            1. **获取 AOSL 核心**（只需一次，SDK 不含）：在 SDK 根目录执行

                ```bash
                git clone https://github.com/AgoraIO-Community/aosl components/3rdparty/agora/aosl
                git -C components/3rdparty/agora/aosl checkout d825607
                ```

                缺少这个目录时，构建会停止并打印这两行命令。

            2. **构建**

                ```bash
                make -C apps/multimedia/ipro_agora_sentino
                ```

                镜像位于 `apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin`。

            3. **烧录**：进入[下载模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目录执行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin
                ```

                确认 `[All Success]` 后按一下 SW2。

            4. **设置与运行**：以 115200 baud 打开控制台，开机打印 `IPRO7 Agora Sentino AI Gateway`。输入 `sentino_triple set <pid> <uuid> <secret>` 后输入 `reboot`。开发板以 BLE 名称 `RY` 广播，用 Sentino 手机 App 发送 IPRO6S FIN 卡的 Wi-Fi 配置与服务器配置（或在控制台输入 `wifi_set <ssid> <psk>`）；登录后即可对着麦克风与 AI 对话。

            </div>
          ja: |
            必要なもの：`ipro6_if_wifi` ファームウェア（`defconfig_ipro6_sdio`）を実行し、JP3 を GPIO に設定して microSD スロットに挿した IPRO6S FIN カード、スピーカーコネクターに接続したスピーカー、ボードごとの Sentino デバイストリプルと Sentino スマートフォンアプリ（Sentino から入手します。SDK には含まれません）、インターネットに接続できる 2.4 GHz アクセスポイント。

            <div class="ipro-steps" markdown>

            1. **AOSL コアの取得**（初回のみ。SDK には含まれません）：SDK のルートで次を実行します。

                ```bash
                git clone https://github.com/AgoraIO-Community/aosl components/3rdparty/agora/aosl
                git -C components/3rdparty/agora/aosl checkout d825607
                ```

                このディレクトリがないと、ビルドは停止してこの 2 つのコマンドを表示します。

            2. **ビルド**

                ```bash
                make -C apps/multimedia/ipro_agora_sentino
                ```

                イメージは `apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin` です。

            3. **書き込み**：[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)に入り、IntelProCube のディレクトリで次を実行します。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin
                ```

                `[All Success]` を確認してから SW2 を押します。

            4. **設定と実行**：115200 baud でコンソールを開くと、ボードが `IPRO7 Agora Sentino AI Gateway` を表示します。`sentino_triple set <pid> <uuid> <secret>` と入力してから `reboot` を入力します。ボードは BLE 名 `RY` でアドバタイズします。Sentino スマートフォンアプリから IPRO6S FIN カード用の Wi-Fi 設定とサーバー設定を送信します（またはコンソールで `wifi_set <ssid> <psk>` と入力します）。ログインが完了したら、マイクに向かって AI と会話できます。

