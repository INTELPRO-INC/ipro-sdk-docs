# Shipped applications for the examples pages (tools/gen_examples.py).
# The catalog tables in examples/index.md and the example pages are generated from this
# file and the app READMEs of the SDK release given with --sdk.
#
# The site documents one board, the IPRO7AI Reef EVK V4.0: only the apps that build for it
# get a page (category `reef`, each with a `reef` section). Every other shipped app is
# listed in the catalog with the board it needs and `readme: {exclude: true}`.
#
# build: {zh, en} replaces the default "make -C <path>" in the page's facts table.
# reef: {zh, en} Markdown for the "Run it on the Reef" section (links relative to examples/).
# readme.replace: regex substitutions applied to the README before publishing (each must
#   match at least once, so a rule that no longer applies fails loudly).
# readme.redline_ignore: rule ids whose matches on prose lines are accepted as reviewed.
# readme.exclude: true to leave the README out (catalog only, unless `reef` is set).
categories:
  - id: reef
    title: {zh: "Reef EVK 範例", en: "Reef EVK examples"}
    apps:
      - name: ipro7ai_reef_demo
        path: apps/platform/ipro7ai_reef_demo
        purpose:
          zh: "Reef 開箱韌體：RGB LED、按鍵、喇叭與耳機、PDM 與耳麥麥克風、microSD、OV5640 相機各有一組 shell 指令；`mic usb` 讓板子成為 USB 麥克風，`mic sdrec` 把錄音存成 SD 卡上的 WAV 檔"
          en: "Reef out-of-box firmware: a shell command group for the RGB LED, keys, speaker and headset, PDM and headset microphones, microSD and the OV5640 camera; `mic usb` turns the board into a USB microphone, `mic sdrec` records WAV files to the SD card"
        boards:
          zh: "Reef（`.config`）；Reef＋IPRO6S FIN 卡（`defconfig_wifi_ipro6s`：Wi-Fi 與 RTSP 相機串流）"
          en: "Reef (`.config`); Reef + IPRO6S FIN card (`defconfig_wifi_ipro6s`: Wi-Fi and an RTSP camera stream)"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        build:
          zh: "`make -C apps/platform/ipro7ai_reef_demo`；Wi-Fi 版加上 `DEFCONFIG=defconfig_wifi_ipro6s`"
          en: "`make -C apps/platform/ipro7ai_reef_demo`; Wi-Fi build: add `DEFCONFIG=defconfig_wifi_ipro6s`"
        reef:
          zh: |
            SW7 在 CAM、SW8 在 PWR，U6 接上主控台線，USB-C 供電（見 [Reef 上手](../hardware/boards/reef-evk.md#quick-start)）。

            <div class="ipro-steps" markdown>

            1. **建置**：在 SDK 根目錄執行

                ```bash
                make -C apps/platform/ipro7ai_reef_demo
                ```

                結尾印出 Flash 與 RAM 用量，映像在 `apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin`。

            2. **燒錄**：讓板子進入[下載模式](../hardware/boards/reef-evk.md#download-mode)（按住 SW1，按一下 SW2，放開 SW1），在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin
                ```

                輸出出現 `[All Success]` 才算成功（工具失敗時也以 0 結束）。按一下 SW2 啟動新韌體。

            3. **執行**：以 115200 baud 開啟主控台，輸入 `reef selftest`。

                開機時 RGB LED 呼吸一次藍光；`reef selftest` 約 3 秒內依序點亮紅、綠、藍光，喇叭發出 1 kHz 測試音，再檢查 SD 卡偵測與相機。按 SW3、SW4、SW5、SW1 分別亮紅、綠、藍、白光。

            </div>

            一次完成建置、燒錄與主控台（板上已有 SDK 韌體時會自動送出 `reboot_dl`）：

            ```bash
            export IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos
            ./build_freertos.sh -p /dev/cu.usbserial-XXXX \
                -P <ICUBE>/chips/ipro7/partition/partition_cfg_2M.toml \
                build flash monitor ipro7ai_reef_demo
            ```

            Wi-Fi 與 RTSP 版以 `DEFCONFIG=defconfig_wifi_ipro6s` 建置，輸出在 `build_wifi_ipro6s/build_out/`，需要執行 `ipro6_if_wifi` 韌體的 IPRO6S FIN 卡，步驟見 [Wi-Fi 與 RTSP 相機串流](../tutorials/wifi-rtsp.md)。這個設定不含 USB 裝置，沒有 `mic usb`。指令總表見 [Reef 開箱韌體](../hardware/boards/reef-evk.md#reef-demo)。
          en: |
            Set SW7 to CAM and SW8 to PWR, connect the console cable to U6 and power the board from USB-C (see [Reef quick start](../hardware/boards/reef-evk.md#quick-start)).

            <div class="ipro-steps" markdown>

            1. **Build** from the SDK root:

                ```bash
                make -C apps/platform/ipro7ai_reef_demo
                ```

                The build ends with the flash and RAM usage; the image is `apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin`.

            2. **Flash**: put the board in [download mode](../hardware/boards/reef-evk.md#download-mode) (hold SW1, press SW2, release SW1), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin
                ```

                Flashing worked only if the output shows `[All Success]` (the tool exits 0 even on failure). Press SW2 to start the new firmware.

            3. **Run**: open the console at 115200 baud and type `reef selftest`.

                At power-on the RGB LED breathes blue once. `reef selftest` lights red, green and blue, plays a 1 kHz tone on the speaker, then checks the SD card detect and the camera, in about 3 seconds. SW3, SW4, SW5 and SW1 light the LED red, green, blue and white.

            </div>

            Build, flash and open the console in one command (with SDK firmware already running, the script sends `reboot_dl` itself):

            ```bash
            export IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos
            ./build_freertos.sh -p /dev/cu.usbserial-XXXX \
                -P <ICUBE>/chips/ipro7/partition/partition_cfg_2M.toml \
                build flash monitor ipro7ai_reef_demo
            ```

            The Wi-Fi and RTSP build uses `DEFCONFIG=defconfig_wifi_ipro6s`, builds into `build_wifi_ipro6s/build_out/` and needs an IPRO6S FIN card running the `ipro6_if_wifi` firmware; see [Wi-Fi and RTSP Camera Stream](../tutorials/wifi-rtsp.md). That configuration has no USB device, so `mic usb` is not available. The full command list is under [Reef out-of-box firmware](../hardware/boards/reef-evk.md#reef-demo).
      - name: ipro_reef_teach
        path: apps/ai/ipro_reef_teach
        purpose:
          zh: "Reef 的 Edge AI 韌體：一個映像包含三個 Teach 工具，`image`（USB 相機＋影像分類）、`voice`（聲紋辨識）與 `sensor`（感測器分類），開機時依 Flash 中儲存的模式擇一執行，由 IPRO AI Studio 操作。完整操作見 [IPRO AI Teach](../teach/index.md)"
          en: "The Reef's Edge AI firmware: one image with three Teach tools, `image` (USB camera + image classifier), `voice` (speaker recognition) and `sensor` (sensor classification); the mode stored in flash picks one at boot, driven from IPRO AI Studio. Full walkthrough: [IPRO AI Teach](../teach/index.md)"
        boards:
          zh: "Reef（`.config`）；`image` 模式需要 OV5640 相機"
          en: "Reef (`.config`); `image` mode needs the OV5640 camera"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        reef:
          zh: |
            這個韌體使用自己的分割表 `partition_reef_teach.toml`（韌體 640 KB、mfg 1364 KB），第一次燒錄時連同 mfg 資料（開機模式與聲紋模型）一起寫入。影像與感測器模型之後由 IPRO AI Studio 經 USB 部署。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/ai/ipro_reef_teach
                ```

                映像在 `apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin`（約 360 KB）。

            2. **產生 mfg 資料**：開機模式（此處為 `image`）與隨附的聲紋模型

                ```bash
                python3 apps/ai/ipro_reef_teach/mfg_payload.py \
                    --voice apps/ai/ipro_reef_teach/model/model_b.spkb --mode image -o reef_teach_mfg.bin
                ```

                在 SDK 根目錄產生 `reef_teach_mfg.bin`。

            3. **燒錄**：讓板子進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --skip-ota --pt <SDK>/apps/ai/ipro_reef_teach/partition_reef_teach.toml \
                    --firmware <SDK>/apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin \
                    --mfg <SDK>/reef_teach_mfg.bin
                ```

                確認輸出有 `[All Success]`，按一下 SW2。之後只更新韌體時拿掉 `--mfg`，模式與三個模型都會保留。

            4. **確認模式**：以 115200 baud 開啟主控台。開機訊息中的 `RTCH:   mode: image` 一行表示目前的模式。輸入 `mode voice`，板子約 2 秒後以聲紋模式重新開機，印出 `RTCH: voice ready`。

            </div>

            每個模式的 USB-C 識別碼不同（VID `0x3896`）：`image` 為 PID `0x0705`（UVC 相機＋序列埠），`voice` 為 `0x0720`、`sensor` 為 `0x0721`（序列埠）。不安裝 IPRO AI Studio 時，可以用瀏覽器版影像 Teach（`python3 tools/teach_web/serve.py`，以 Chrome 或 Edge 開啟 http://localhost:8780）。各模式的操作見 [IPRO AI Teach](../teach/index.md)。
          en: |
            This firmware has its own partition table, `partition_reef_teach.toml` (640 KB firmware, 1364 KB mfg). The first flash also writes the mfg payload: the boot mode and the voiceprint model. IPRO AI Studio deploys the image and sensor models over USB later.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/ai/ipro_reef_teach
                ```

                The image is `apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin` (about 360 KB).

            2. **Make the mfg payload**: the boot mode (`image` here) and the bundled voiceprint model

                ```bash
                python3 apps/ai/ipro_reef_teach/mfg_payload.py \
                    --voice apps/ai/ipro_reef_teach/model/model_b.spkb --mode image -o reef_teach_mfg.bin
                ```

                This writes `reef_teach_mfg.bin` in the SDK root.

            3. **Flash**: put the board in [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --skip-ota --pt <SDK>/apps/ai/ipro_reef_teach/partition_reef_teach.toml \
                    --firmware <SDK>/apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin \
                    --mfg <SDK>/reef_teach_mfg.bin
                ```

                Check for `[All Success]`, then press SW2. To update only the firmware later, leave out `--mfg`; the mode and all three models stay.

            4. **Check the mode**: open the console at 115200 baud. The boot line `RTCH:   mode: image` names the running mode. Type `mode voice`: the board restarts in voice mode in about 2 seconds and prints `RTCH: voice ready`.

            </div>

            Each mode has its own USB-C identity (VID `0x3896`): `image` is PID `0x0705` (UVC camera + serial port), `voice` `0x0720` and `sensor` `0x0721` (serial port). Without IPRO AI Studio, the image tool also runs in a browser: `python3 tools/teach_web/serve.py`, then open http://localhost:8780 in Chrome or Edge. Each mode is walked through in [IPRO AI Teach](../teach/index.md).
      - name: ipro_ble_remote
        path: apps/bluetooth/ble/ipro_ble_remote
        purpose:
          zh: "GATT 參考應用：LED、按鍵、環境、UART、相機影像與影像上傳服務；Reef 版另有 Reef 硬體服務與 BLE A/B OTA。隨附 Android 示範 App `ipro_remote_demo.apk`。教學見[第一個 BLE 應用](../tutorials/first-ble-app.md)"
          en: "GATT reference: LED, key, environment, UART, camera image and image upload services; the Reef build adds a Reef hardware service and BLE A/B OTA. Ships the Android demo app `ipro_remote_demo.apk`. Tutorial: [Your First BLE Application](../tutorials/first-ble-app.md)"
        boards:
          zh: "Reef（`defconfig_reef`：WS2812、相機、SD 卡、音訊與 BLE A/B OTA）；`.config`、`defconfig` 為 IPRO7 EVB"
          en: "Reef (`defconfig_reef`: WS2812, camera, SD card, audio and BLE A/B OTA); `.config` and `defconfig` target the IPRO7 EVB"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        build:
          zh: "Reef：`make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef`"
        reef:
          zh: |
            Reef 版使用 boot2 與 A/B 分割表 `partition_cfg_2M_remote_ab.toml`，才能做 BLE OTA。第一次燒錄要連同 boot2 一起寫入；boot2 映像隨 IntelProCube 提供，不在 SDK 內。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin`。只執行 `make`（不加 `DEFCONFIG=`）建置的是 IPRO7 EVB 版。

            2. **第一次燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --boot2 chips/ipro7/builtin_imgs/boot2_v0.5.2/ipro_boot2_IPRO7_v0.5.2.bin \
                    --pt <SDK>/apps/bluetooth/ble/ipro_ble_remote/partition_cfg_2M_remote_ab.toml \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            3. **執行**：以 115200 baud 開啟主控台。開機訊息先出現 `[BOOT2] IPRO7 Boot2 v0.5.2`，接著是 `[BLE] Advertising: IPRO-Remote`。以手機的 nRF Connect 或 `ipro_remote_demo.apk` 連線到 `IPRO-Remote`；主控台輸入 `reef status` 查看板卡、相機與 LED 狀態。

            4. **BLE OTA**：產生 OTA 套件並以 BLE 推送（主機需安裝 Python 套件 `bleak`）

                ```bash
                IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos sh apps/bluetooth/ble/ipro_ble_remote/tools/make_reef_ota.sh
                python3 apps/bluetooth/ble/ipro_ble_remote/tools/reef_ota.py \
                    apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_reef.xz.ota
                ```

                套件約 345 KB，傳完後板子重新開機，從新映像啟動。

            </div>

            !!! warning "OTA 只用 A/B 分割表"
                不要在 Reef 上以標準的 `partition_cfg_2M.toml` 做 OTA：寫入它的 FW B 並切換後，板子沒有任何輸出，只能進下載模式重新燒錄。
          en: |
            The Reef build uses boot2 and the A/B partition table `partition_cfg_2M_remote_ab.toml`, which BLE OTA needs. The first flash writes boot2 too; the boot2 image comes with IntelProCube, not with the SDK.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef
                ```

                The image is `apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin`. A plain `make` (no `DEFCONFIG=`) builds the IPRO7 EVB version.

            2. **First flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --boot2 chips/ipro7/builtin_imgs/boot2_v0.5.2/ipro_boot2_IPRO7_v0.5.2.bin \
                    --pt <SDK>/apps/bluetooth/ble/ipro_ble_remote/partition_cfg_2M_remote_ab.toml \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at 115200 baud. The boot log starts with `[BOOT2] IPRO7 Boot2 v0.5.2`, then shows `[BLE] Advertising: IPRO-Remote`. Connect to `IPRO-Remote` with nRF Connect or `ipro_remote_demo.apk` on a phone; `reef status` at the console shows the board, camera and LED state.

            4. **BLE OTA**: build the OTA package and push it over BLE (the host needs the Python package `bleak`):

                ```bash
                IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos sh apps/bluetooth/ble/ipro_ble_remote/tools/make_reef_ota.sh
                python3 apps/bluetooth/ble/ipro_ble_remote/tools/reef_ota.py \
                    apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_reef.xz.ota
                ```

                The package is about 345 KB; when it is in, the board restarts from the new image.

            </div>

            !!! warning "OTA needs the A/B table"
                Never OTA a Reef that was flashed with the stock `partition_cfg_2M.toml`: after an update is written to its FW B and selected, the board prints nothing and has to be reflashed from download mode.
      - name: ipro_throughput_test
        path: apps/bluetooth/ble/ipro_throughput_test
        purpose:
          zh: "兩板 BLE 吞吐量測試：1M／2M／Coded PHY、DLE、ATT MTU 247。教學見 [BLE 吞吐量測試](../tutorials/ble-throughput.md)"
          en: "Two-board BLE throughput test: 1M / 2M / Coded PHY, DLE, ATT MTU 247. Tutorial: [BLE Throughput Test](../tutorials/ble-throughput.md)"
        boards:
          zh: "兩塊 Reef（`defconfig_reef`）；`.config` 為 IPRO7 EVB"
          en: "Two Reefs (`defconfig_reef`); `.config` targets the IPRO7 EVB"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        build:
          zh: "Reef：`make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef`"
        reef:
          zh: |
            需要兩塊 Reef，各接一條主控台線。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin`。

            2. **燒錄兩塊板**：每塊板進入[下載模式](../hardware/boards/reef-evk.md#download-mode)後，在 IntelProCube 目錄執行（`--port` 換成該板的序列埠）

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin
                ```

                兩塊板都要看到 `[All Success]`，再各按一下 SW2。

            3. **執行**：以 115200 baud 各開一個主控台。重置約 7 秒後印出 `BLE initialized`。一塊板輸入 `tp slave`（以 `IPRO-TP-TEST` 廣播），另一塊輸入 `tp master`，等到 `Notifications enabled - ready for test`；在傳送端輸入 `tp phy 2` 與 `tp start 244 10`，10 秒後印出結果摘要。

            </div>
          en: |
            You need two Reefs, each with a console cable.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef
                ```

                The image is `apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin`.

            2. **Flash both boards**: put each board in [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run (with that board's port)

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin
                ```

                Both boards must show `[All Success]`; then press SW2 on each.

            3. **Run**: open a console on each board at 115200 baud. About 7 seconds after reset each prints `BLE initialized`. Type `tp slave` on one board (it advertises as `IPRO-TP-TEST`) and `tp master` on the other, and wait for `Notifications enabled - ready for test`. On the sender type `tp phy 2` and `tp start 244 10`; the summary follows after 10 seconds.

            </div>
        readme:
          # these lines say the old tool is retired, which is correct
          redline_ignore: [retired-tool]
      - name: ipro_le_audio_headset
        path: apps/bluetooth/le_audio/ipro_le_audio_headset
        purpose:
          zh: "LE Audio unicast 耳機：BAP unicast server、PACS、ASCS、CAP、CSIP、VCP，LC3 解碼後由 DAC 輸出。教學見 [LE Audio 入門](../tutorials/le-audio.md)"
          en: "LE Audio unicast headset: BAP unicast server, PACS, ASCS, CAP, CSIP, VCP, with LC3 decoded to the DAC. Tutorial: [Getting Started with LE Audio](../tutorials/le-audio.md)"
        boards:
          zh: "Reef（`defconfig_reef`：DAC 輸出到耳麥孔與喇叭）；`.config`、`DAC.config`、`UAC.config` 為 IPRO7 EVB"
          en: "Reef (`defconfig_reef`: DAC output to the headset jack and speaker); `.config`, `DAC.config` and `UAC.config` target the IPRO7 EVB"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        build:
          zh: "Reef：`make -C apps/bluetooth/le_audio/ipro_le_audio_headset DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/bluetooth/le_audio/ipro_le_audio_headset DEFCONFIG=defconfig_reef`"
        reef:
          zh: |
            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/bluetooth/le_audio/ipro_le_audio_headset DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/bluetooth/le_audio/ipro_le_audio_headset/build_reef/build_out/ipro_le_audio_headset_IPRO7.bin`。

            2. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/le_audio/ipro_le_audio_headset/build_reef/build_out/ipro_le_audio_headset_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            3. **執行**：以 115200 baud 開啟主控台。板子以 `IPRO-LE-Audio` 廣播；以支援 LE Audio 的手機配對，數字比對在板上自動確認。主控台輸入 `leaudio_status` 查看連線與串流狀態。SW3、SW4、SW5 經 VCP 分別調低音量、調高音量與靜音。

            </div>

            !!! info "本版狀態"
                應用 README 記載：手機可連線、探索服務並以安全等級 4 綁定；由手機串流媒體尚未驗證。
          en: |
            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/bluetooth/le_audio/ipro_le_audio_headset DEFCONFIG=defconfig_reef
                ```

                The image is `apps/bluetooth/le_audio/ipro_le_audio_headset/build_reef/build_out/ipro_le_audio_headset_IPRO7.bin`.

            2. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/le_audio/ipro_le_audio_headset/build_reef/build_out/ipro_le_audio_headset_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at 115200 baud. The board advertises as `IPRO-LE-Audio`; pair it from an LE Audio phone (numeric comparison is confirmed on the board automatically). `leaudio_status` at the console shows the connection and stream state. SW3, SW4 and SW5 are volume down, volume up and mute through VCP.

            </div>

            !!! info "Status in this release"
                The application's README records that a phone connects, discovers the services and bonds at security level 4; media streaming from a phone is not validated yet.
        readme:
          replace:
            # host-side log paths in the README's test commands: a generic temp dir
            - pattern: '/private/tmp/'
              repl: '/tmp/'
      - name: ipro7_uvc_cam
        path: apps/multimedia/ipro7_uvc_cam
        purpose:
          zh: "USB 網路攝影機：OV5640、ISP、硬體 MJPEG、USB Video Class；另一個 Reef 設定在 NPU 上跑剪刀石頭布並畫進影像。教學見 [USB 網路攝影機與剪刀石頭布](../tutorials/usb-webcam.md)"
          en: "USB webcam: OV5640, ISP, hardware MJPEG, USB Video Class; a second Reef configuration plays rock-paper-scissors on the NPU and draws it into the stream. Tutorial: [USB Webcam and Rock-Paper-Scissors](../tutorials/usb-webcam.md)"
        boards:
          zh: "Reef（`defconfig_reef_ov5640`：網路攝影機；`defconfig_reef_rps`：剪刀石頭布）；`.config` 為 IPRO7 EVB 搭配 SC101IOT"
          en: "Reef (`defconfig_reef_ov5640`: webcam; `defconfig_reef_rps`: rock-paper-scissors); `.config` targets the IPRO7 EVB with an SC101IOT"
        console:
          zh: "Reef：UART 115200<br>`.config`：UART 921600"
          en: "Reef: UART 115200<br>`.config`: UART 921600"
        build:
          zh: "Reef：`make -C apps/multimedia/ipro7_uvc_cam DEFCONFIG=defconfig_reef_ov5640`（或 `defconfig_reef_rps`）"
          en: "Reef: `make -C apps/multimedia/ipro7_uvc_cam DEFCONFIG=defconfig_reef_ov5640` (or `defconfig_reef_rps`)"
        reef:
          zh: |
            SW7 必須在 CAM。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/multimedia/ipro7_uvc_cam DEFCONFIG=defconfig_reef_ov5640   # 網路攝影機
                make -C apps/multimedia/ipro7_uvc_cam DEFCONFIG=defconfig_reef_rps      # 剪刀石頭布
                ```

                映像分別在 `apps/multimedia/ipro7_uvc_cam/build_reef_ov5640/build_out/` 與 `build_reef_rps/build_out/`，檔名都是 `ipro7_uvc_cam_IPRO7.bin`。

            2. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro7_uvc_cam/build_reef_ov5640/build_out/ipro7_uvc_cam_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。剪刀石頭布的模型已連結進韌體，不需要另外燒錄。

            3. **執行**：USB-C 接到電腦。主控台（115200 baud）印出 `[UVC] Streaming pipeline started`，電腦出現名為「IPRO7 UVC Cam」的相機（VID `0x3896`、PID `0x0701`），不需安裝驅動程式。以任一相機程式開啟：網路攝影機版可選 1280×720（約 15 fps）或 640×360（30 fps）；剪刀石頭布版為 640×360，畫面上有出拳框、即時判讀、3-2-1 倒數與比分。

            </div>
          en: |
            SW7 must be on CAM.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/multimedia/ipro7_uvc_cam DEFCONFIG=defconfig_reef_ov5640   # webcam
                make -C apps/multimedia/ipro7_uvc_cam DEFCONFIG=defconfig_reef_rps      # rock-paper-scissors
                ```

                The images are in `apps/multimedia/ipro7_uvc_cam/build_reef_ov5640/build_out/` and `build_reef_rps/build_out/`, both named `ipro7_uvc_cam_IPRO7.bin`.

            2. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro7_uvc_cam/build_reef_ov5640/build_out/ipro7_uvc_cam_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2. The rock-paper-scissors model is linked into the firmware; there is nothing else to flash.

            3. **Run**: connect USB-C to the computer. The console (115200 baud) prints `[UVC] Streaming pipeline started` and the computer finds a camera named "IPRO7 UVC Cam" (VID `0x3896`, PID `0x0701`) with no driver to install. Open it in any camera app: the webcam build offers 1280×720 (about 15 fps) or 640×360 (30 fps); the rock-paper-scissors build streams 640×360 with a play box, the live label, a 3-2-1 countdown and the score.

            </div>
      - name: ipro7_jpeg_decode
        path: apps/multimedia/ipro7_jpeg_decode
        purpose:
          zh: "以軟體（TJpgDec）把 JPEG 解碼成 RGB565／RGB888，附格式探測、內建測試圖與主機端工具；IPRO7 的 MJPEG 硬體只能編碼"
          en: "Software JPEG decoding (TJpgDec) to RGB565 / RGB888, with a format probe, built-in test images and host tools; IPRO7's MJPEG block encodes only"
        boards:
          zh: "Reef（`defconfig_reef`）；`.config` 為 IPRO7AI EVK"
          en: "Reef (`defconfig_reef`); `.config` targets the IPRO7AI EVK"
        console:
          zh: "UART **921600**"
          en: "UART **921600**"
        build:
          zh: "Reef：`make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef`"
        reef:
          zh: |
            這是 Reef 設定中唯一主控台為 921600 baud 的應用。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin`，測試圖已連結在內。

            2. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            3. **執行**：以 **921600** baud 開啟主控台。開機印出 `ipro7_jpeg_decode: JPEG -> RGB565 / RGB888, ...`；輸入 `jdec run all`，最後一行為 `... failed -> ALL PASS`。`jdec list` 列出測試圖與預期結果。

            </div>
          en: |
            This is the only Reef configuration with its console at 921600 baud.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/multimedia/ipro7_jpeg_decode DEFCONFIG=defconfig_reef
                ```

                The image is `apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin`, with the test images linked in.

            2. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/multimedia/ipro7_jpeg_decode/build_reef/build_out/ipro7_jpeg_decode_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at **921600** baud. The board prints `ipro7_jpeg_decode: JPEG -> RGB565 / RGB888, ...`; type `jdec run all` and the last line reads `... failed -> ALL PASS`. `jdec list` lists the test images and what is expected of each.

            </div>
      - name: ipro_ai_link
        path: apps/test/ipro_ai_link
        purpose:
          zh: "IPRO AI Studio「Run on board」的板端韌體：由 microSD（`sd:/`）載入 `.inm` 模型與輸入、在 NPU 上推論、輸出原始結果；也可在主控台手動操作"
          en: "Board firmware for IPRO AI Studio \"Run on board\": loads `.inm` models and inputs from microSD (`sd:/`), runs them on the NPU and prints the raw outputs; also usable by hand from the console"
        boards:
          zh: "Reef（`defconfig_reef`）；`.config` 為 IPRO7 EVB"
          en: "Reef (`defconfig_reef`); `.config` targets the IPRO7 EVB"
        console:
          zh: "UART 115200（另有 USB CDC 主控台）"
          en: "UART 115200 (also on a USB CDC port)"
        build:
          zh: "Reef：`make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef`"
        readme: {exclude: true}   # no README in the release
        reef:
          zh: |
            這個應用沒有 README，以下依原始碼整理。需要一張 FAT 格式的 microSD 卡。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin`。

            2. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            3. **執行**：以 115200 baud 開啟主控台，開機印出 `ipro_ai_link ready`。USB-C 接上電腦時，板子出現為兩個 CDC 序列埠（VID `0x3896`、PID `0x0704`）：第一個傳資料，第二個是主控台。

            4. **手動推論**：把 `.inm` 模型與原始輸入檔複製到 SD 卡，插入卡座後依序輸入

                ```text
                ai_mount
                ai_load sd:/model.inm
                ai_input sd:/input.bin
                ai_run
                ai_out
                ```

                `ai_out` 以十六進位印出輸出張量，每個位元組都以 XOR 0x80 儲存。路徑一律以 `sd:/` 開頭。

            </div>

            SDK 隨附可用的模型，例如 `apps/platform/ipro7_demo/demo/ai/ai_model/mbv2.inm`。IPRO AI Studio 可從 [GitHub](https://github.com/INTELPRO-INC/ipro-ai-studio/releases/latest) 下載。
          en: |
            This application has no README; the steps below follow its source. You need a FAT-formatted microSD card.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/test/ipro_ai_link DEFCONFIG=defconfig_reef
                ```

                The image is `apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin`.

            2. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/test/ipro_ai_link/build_reef/build_out/ipro_ai_link_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at 115200 baud; the board prints `ipro_ai_link ready`. On a computer's USB port the board shows up as two CDC serial ports (VID `0x3896`, PID `0x0704`): the first carries data, the second is a console.

            4. **Run a model by hand**: copy an `.inm` model and a raw input file to the SD card, insert it, then type

                ```text
                ai_mount
                ai_load sd:/model.inm
                ai_input sd:/input.bin
                ai_run
                ai_out
                ```

                `ai_out` prints the output tensor in hex, every byte stored XOR 0x80. Paths always start with `sd:/`.

            </div>

            The SDK ships models to try, for example `apps/platform/ipro7_demo/demo/ai/ai_model/mbv2.inm`. Download IPRO AI Studio from [GitHub](https://github.com/INTELPRO-INC/ipro-ai-studio/releases/latest).
      - name: ipro_agora_sentino
        path: apps/multimedia/ipro_agora_sentino
        purpose:
          zh: "Sentino 雲端 AI 語音對話：BLE 配網、經 IPRO6S FIN 卡連 Wi-Fi、MQTT 登入、Agora RTC 即時語音；需另備 Sentino 裝置三元組與 AOSL 核心"
          en: "Sentino cloud AI voice chat: BLE provisioning, Wi-Fi through the IPRO6S FIN card, MQTT login and Agora RTC voice; needs a Sentino device triple and the AOSL core"
        boards:
          zh: "Reef＋IPRO6S FIN 卡（`.config`，`make` 或 `make BOARD=reef`）；`BOARD=evk` 為 IPRO7AI EVK（可建置，未經板上驗證）"
          en: "Reef + IPRO6S FIN card (`.config`, `make` or `make BOARD=reef`); `BOARD=evk` targets the IPRO7AI EVK (builds, not verified on a board)"
        console:
          zh: "Reef：UART 115200"
          en: "Reef: UART 115200"
        reef:
          zh: |
            需要：插在 microSD 卡座、執行 `ipro6_if_wifi`（`defconfig_ipro6_sdio`）韌體的 IPRO6S FIN 卡，JP3 在 GPIO；接在喇叭座的喇叭；每塊板一組 Sentino 裝置三元組與 Sentino 手機 App（向 Sentino 取得，不隨 SDK 提供）；可連網際網路的 2.4 GHz 基地台。

            <div class="ipro-steps" markdown>

            1. **取得 AOSL 核心**（只需一次，SDK 不含）：在 SDK 根目錄執行

                ```bash
                git clone https://github.com/AgoraIO-Community/aosl components/3rdparty/agora/aosl
                git -C components/3rdparty/agora/aosl checkout d825607
                ```

                缺少這個目錄時，建置會停下並印出這兩行指令。

            2. **建置**

                ```bash
                make -C apps/multimedia/ipro_agora_sentino
                ```

                映像在 `apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin`。

            3. **燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            4. **設定與執行**：以 115200 baud 開啟主控台，開機印出 `IPRO7 Agora Sentino AI Gateway`。輸入 `sentino_triple set <pid> <uuid> <secret>` 後 `reboot`。板子以 BLE 名稱 `RY` 廣播，以 Sentino 手機 App 送出 IPRO6S FIN 卡的 Wi-Fi 設定與伺服器設定（或在主控台輸入 `wifi_set <ssid> <psk>`）；登入後即可對著麥克風與 AI 對話。

            </div>
          en: |
            You need: an IPRO6S FIN card in the microSD slot running the `ipro6_if_wifi` firmware (`defconfig_ipro6_sdio`), with JP3 on GPIO; a speaker on the speaker connector; a Sentino device triple per board and the Sentino phone app (from Sentino, not part of the SDK); a 2.4 GHz access point with internet access.

            <div class="ipro-steps" markdown>

            1. **Get the AOSL core** (once; not part of the SDK). From the SDK root:

                ```bash
                git clone https://github.com/AgoraIO-Community/aosl components/3rdparty/agora/aosl
                git -C components/3rdparty/agora/aosl checkout d825607
                ```

                Without this directory the build stops and prints these two commands.

            2. **Build**

                ```bash
                make -C apps/multimedia/ipro_agora_sentino
                ```

                The image is `apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin`.

            3. **Flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/multimedia/ipro_agora_sentino/build/build_out/ipro_agora_sentino_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            4. **Set up and run**: open the console at 115200 baud; the board prints `IPRO7 Agora Sentino AI Gateway`. Type `sentino_triple set <pid> <uuid> <secret>`, then `reboot`. The board advertises over BLE as `RY`; send the Wi-Fi settings for the IPRO6S FIN card and the server settings from the Sentino phone app (or type `wifi_set <ssid> <psk>` at the console). Once logged in, talk to the AI through the microphone.

            </div>
