        boards:
          zh: "EVB"
          en: "EVB"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        readme:
          replace:
            # never publish the lab network name or passphrase
            - {pattern: '^(ipronet_up|ipro6s_connect)[ \t]+\S+[ \t]+\S+', repl: '\1 <ssid> <psk>'}
            - {pattern: ' - see the ipro7-probe skill', repl: ''}
