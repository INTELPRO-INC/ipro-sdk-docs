# Shipped applications for the examples pages (tools/gen_examples.py).
# The catalog tables in examples/index.md and the example pages are generated from this
# file and the app READMEs of the SDK release given with --sdk.
#
# The site documents one board, the IPRO7AI Reef EVK V4.0: only the apps that build for it
# get a page (category `reef`, each with a `reef` section). Every other shipped app is
# listed in the catalog with the board it needs and `readme: {exclude: true}`.
#
# build: {zh, en} replaces the default "make -C <path>" in the page's facts table.
# reef: {zh, en} Markdown for the "Run it on the Reef" section (links relative to examples/).
# readme.replace: regex substitutions applied to the README before publishing (each must
#   match at least once, so a rule that no longer applies fails loudly).
# readme.redline_ignore: rule ids whose matches on prose lines are accepted as reviewed.
# readme.exclude: true to leave the README out (catalog only, unless `reef` is set).
categories:
  - id: reef
    title: {zh: "Reef EVK 範例", en: "Reef EVK examples", zh-cn: "Reef EVK 示例", ja: "Reef EVK のサンプル"}
    apps:
      - name: ipro7ai_reef_demo
        path: apps/platform/ipro7ai_reef_demo
        purpose:
          zh: "Reef 開箱韌體：RGB LED、按鍵、喇叭與耳機、PDM 與耳麥麥克風、microSD、OV5640 相機各有一組 shell 指令；`mic usb` 讓板子成為 USB 麥克風，`mic sdrec` 把錄音存成 SD 卡上的 WAV 檔"
          en: "Reef out-of-box firmware: a shell command group for the RGB LED, keys, speaker and headset, PDM and headset microphones, microSD and the OV5640 camera; `mic usb` turns the board into a USB microphone, `mic sdrec` records WAV files to the SD card"
          zh-cn: "Reef 出厂固件：RGB LED、按键、扬声器与耳机、PDM 与耳麦麦克风、microSD、OV5640 摄像头各有一组 shell 命令；`mic usb` 让开发板成为 USB 麦克风，`mic sdrec` 把录音保存为 SD 卡上的 WAV 文件"
          ja: "Reef の出荷時ファームウェア：RGB LED、キー、スピーカーとヘッドセット、PDM マイクとヘッドセットマイク、microSD、OV5640 カメラごとにシェルコマンド群があります。`mic usb` でボードが USB マイクになり、`mic sdrec` で SD カードに WAV ファイルを録音します"
        boards:
          zh: "Reef（`.config`）；Reef＋IPRO6S FIN 卡（`defconfig_wifi_ipro6s`：Wi-Fi 與 RTSP 相機串流）"
          en: "Reef (`.config`); Reef + IPRO6S FIN card (`defconfig_wifi_ipro6s`: Wi-Fi and an RTSP camera stream)"
          zh-cn: "Reef（`.config`）；Reef＋IPRO6S FIN 卡（`defconfig_wifi_ipro6s`：Wi-Fi 与 RTSP 摄像头视频流）"
          ja: "Reef（`.config`）、Reef＋IPRO6S FIN カード（`defconfig_wifi_ipro6s`：Wi-Fi と RTSP カメラストリーミング）"
        console:
          zh: "UART 115200"
          en: "UART 115200"
          zh-cn: "UART 115200"
          ja: "UART 115200"
        build:
          zh: "`make -C apps/platform/ipro7ai_reef_demo`；Wi-Fi 版加上 `DEFCONFIG=defconfig_wifi_ipro6s`"
          en: "`make -C apps/platform/ipro7ai_reef_demo`; Wi-Fi build: add `DEFCONFIG=defconfig_wifi_ipro6s`"
          zh-cn: "`make -C apps/platform/ipro7ai_reef_demo`；Wi-Fi 版加上 `DEFCONFIG=defconfig_wifi_ipro6s`"
          ja: "`make -C apps/platform/ipro7ai_reef_demo`、Wi-Fi 版は `DEFCONFIG=defconfig_wifi_ipro6s` を追加"
        reef:
          zh: |
            SW7 在 CAM、SW8 在 PWR，U6 接上主控台線，USB-C 供電（見 [Reef 上手](../hardware/boards/reef-evk.md#quick-start)）。

            <div class="ipro-steps" markdown>

            1. **建置**：在 SDK 根目錄執行

                ```bash
                make -C apps/platform/ipro7ai_reef_demo
                ```

                結尾印出 Flash 與 RAM 用量，映像在 `apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin`。

            2. **燒錄**：讓板子進入[下載模式](../hardware/boards/reef-evk.md#download-mode)（按住 SW1，按一下 SW2，放開 SW1），在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin
                ```

                輸出出現 `[All Success]` 才算成功（工具失敗時也以 0 結束）。按一下 SW2 啟動新韌體。

            3. **執行**：以 115200 baud 開啟主控台，輸入 `reef selftest`。

                開機時 RGB LED 呼吸一次藍光；`reef selftest` 約 3 秒內依序點亮紅、綠、藍光，喇叭發出 1 kHz 測試音，再檢查 SD 卡偵測與相機。按 SW3、SW4、SW5、SW1 分別亮紅、綠、藍、白光。

            </div>

            一次完成建置、燒錄與主控台（板上已有 SDK 韌體時會自動送出 `reboot_dl`）：

            ```bash
            export IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos
            ./build_freertos.sh -p /dev/cu.usbserial-XXXX \
                -P <ICUBE>/chips/ipro7/partition/partition_cfg_2M.toml \
                build flash monitor ipro7ai_reef_demo
            ```

            Wi-Fi 與 RTSP 版以 `DEFCONFIG=defconfig_wifi_ipro6s` 建置，輸出在 `build_wifi_ipro6s/build_out/`，需要執行 `ipro6_if_wifi` 韌體的 IPRO6S FIN 卡，步驟見 [Wi-Fi 與 RTSP 相機串流](../tutorials/wifi-rtsp.md)。這個設定不含 USB 裝置，沒有 `mic usb`。指令總表見 [Reef 開箱韌體](../hardware/boards/reef-evk.md#reef-demo)。
          en: |
            Set SW7 to CAM and SW8 to PWR, connect the console cable to U6 and power the board from USB-C (see [Reef quick start](../hardware/boards/reef-evk.md#quick-start)).

            <div class="ipro-steps" markdown>

            1. **Build** from the SDK root:

                ```bash
                make -C apps/platform/ipro7ai_reef_demo
                ```

                The build ends with the flash and RAM usage; the image is `apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin`.

            2. **Flash**: put the board in [download mode](../hardware/boards/reef-evk.md#download-mode) (hold SW1, press SW2, release SW1), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin
                ```

                Flashing worked only if the output shows `[All Success]` (the tool exits 0 even on failure). Press SW2 to start the new firmware.

            3. **Run**: open the console at 115200 baud and type `reef selftest`.

                At power-on the RGB LED breathes blue once. `reef selftest` lights red, green and blue, plays a 1 kHz tone on the speaker, then checks the SD card detect and the camera, in about 3 seconds. SW3, SW4, SW5 and SW1 light the LED red, green, blue and white.

            </div>

            Build, flash and open the console in one command (with SDK firmware already running, the script sends `reboot_dl` itself):

            ```bash
            export IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos
            ./build_freertos.sh -p /dev/cu.usbserial-XXXX \
                -P <ICUBE>/chips/ipro7/partition/partition_cfg_2M.toml \
                build flash monitor ipro7ai_reef_demo
            ```

            The Wi-Fi and RTSP build uses `DEFCONFIG=defconfig_wifi_ipro6s`, builds into `build_wifi_ipro6s/build_out/` and needs an IPRO6S FIN card running the `ipro6_if_wifi` firmware; see [Wi-Fi and RTSP Camera Stream](../tutorials/wifi-rtsp.md). That configuration has no USB device, so `mic usb` is not available. The full command list is under [Reef out-of-box firmware](../hardware/boards/reef-evk.md#reef-demo).
          zh-cn: |
            SW7 拨到 CAM、SW8 拨到 PWR，U6 接上控制台线，USB-C 供电（见 [Reef 快速上手](../hardware/boards/reef-evk.md#quick-start)）。

            <div class="ipro-steps" markdown>

            1. **构建**：在 SDK 根目录执行

                ```bash
                make -C apps/platform/ipro7ai_reef_demo
                ```

                结尾打印 Flash 与 RAM 用量，镜像位于 `apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin`。

            2. **烧录**：让开发板进入[下载模式](../hardware/boards/reef-evk.md#download-mode)（按住 SW1，按一下 SW2，松开 SW1），在 IntelProCube 目录执行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin
                ```

                输出中出现 `[All Success]` 才算成功（工具失败时也以 0 退出）。按一下 SW2 启动新固件。

            3. **运行**：以 115200 baud 打开控制台，输入 `reef selftest`。

                开机时 RGB LED 呼吸一次蓝光；`reef selftest` 约 3 秒内依次点亮红、绿、蓝光，扬声器发出 1 kHz 测试音，再检查 SD 卡检测与摄像头。按 SW3、SW4、SW5、SW1 分别亮红、绿、蓝、白光。

            </div>

            一次完成构建、烧录与控制台（开发板上已有 SDK 固件时会自动发送 `reboot_dl`）：

            ```bash
            export IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos
            ./build_freertos.sh -p /dev/cu.usbserial-XXXX \
                -P <ICUBE>/chips/ipro7/partition/partition_cfg_2M.toml \
                build flash monitor ipro7ai_reef_demo
            ```

            Wi-Fi 与 RTSP 版以 `DEFCONFIG=defconfig_wifi_ipro6s` 构建，输出在 `build_wifi_ipro6s/build_out/`，需要运行 `ipro6_if_wifi` 固件的 IPRO6S FIN 卡，步骤见 [Wi-Fi 与 RTSP 摄像头视频流](../tutorials/wifi-rtsp.md)。这个配置不含 USB 设备，没有 `mic usb`。命令总表见 [Reef 出厂固件](../hardware/boards/reef-evk.md#reef-demo)。
          ja: |
            SW7 を CAM、SW8 を PWR に設定し、コンソールケーブルを U6 に接続して、USB-C から給電します（[Reef のクイックスタート](../hardware/boards/reef-evk.md#quick-start)を参照）。

            <div class="ipro-steps" markdown>

            1. **ビルド**：SDK のルートで次を実行します。

                ```bash
                make -C apps/platform/ipro7ai_reef_demo
                ```

                ビルドの最後に Flash と RAM の使用量が表示されます。イメージは `apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin` です。

            2. **書き込み**：ボードを[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)にし（SW1 を押したまま SW2 を押し、SW1 を離す）、IntelProCube のディレクトリで次を実行します。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --pt chips/ipro7/partition/partition_cfg_2M.toml \
                    --firmware <SDK>/apps/platform/ipro7ai_reef_demo/build/build_out/ipro7ai_reef_demo_IPRO7.bin
                ```

                出力に `[All Success]` が表示された場合のみ書き込み成功です（ツールは失敗時も 0 で終了します）。SW2 を押して新しいファームウェアを起動します。

            3. **実行**：115200 baud でコンソールを開き、`reef selftest` と入力します。

                電源投入時に RGB LED が青色で 1 回呼吸点灯します。`reef selftest` は約 3 秒で赤、緑、青を点灯し、スピーカーから 1 kHz のトーンを鳴らしたあと、SD カードの検出とカメラを確認します。SW3、SW4、SW5、SW1 を押すと、LED がそれぞれ赤、緑、青、白に点灯します。

            </div>

            ビルド、書き込み、コンソールの起動を 1 つのコマンドで行えます（SDK のファームウェアがすでに動作している場合は、スクリプトが `reboot_dl` を自動で送信します）。

            ```bash
            export IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos
            ./build_freertos.sh -p /dev/cu.usbserial-XXXX \
                -P <ICUBE>/chips/ipro7/partition/partition_cfg_2M.toml \
                build flash monitor ipro7ai_reef_demo
            ```

            Wi-Fi と RTSP 版は `DEFCONFIG=defconfig_wifi_ipro6s` でビルドし、出力先は `build_wifi_ipro6s/build_out/` です。`ipro6_if_wifi` ファームウェアを実行する IPRO6S FIN カードが必要です。手順は [Wi-Fi と RTSP カメラストリーミング](../tutorials/wifi-rtsp.md)を参照してください。この構成には USB デバイスがないため、`mic usb` は使えません。コマンドの一覧は [Reef の出荷時ファームウェア](../hardware/boards/reef-evk.md#reef-demo)にあります。
      - name: ipro_reef_teach
        path: apps/ai/ipro_reef_teach
        purpose:
          zh: "Reef 的 Edge AI 韌體：一個映像包含三個 Teach 工具，`image`（USB 相機＋影像分類）、`voice`（聲紋辨識）與 `sensor`（感測器分類），開機時依 Flash 中儲存的模式擇一執行，由 IPRO AI Studio 操作。完整操作見 [IPRO AI Teach](../teach/index.md)"
          en: "The Reef's Edge AI firmware: one image with three Teach tools, `image` (USB camera + image classifier), `voice` (speaker recognition) and `sensor` (sensor classification); the mode stored in flash picks one at boot, driven from IPRO AI Studio. Full walkthrough: [IPRO AI Teach](../teach/index.md)"
          zh-cn: "Reef 的 Edge AI 固件：一个镜像包含三个 Teach 工具，`image`（USB 摄像头＋图像分类）、`voice`（声纹识别）与 `sensor`（传感器分类），启动时根据 Flash 中保存的模式选择其一运行，由 IPRO AI Studio 操作。完整操作见 [IPRO AI Teach](../teach/index.md)"
          ja: "Reef の Edge AI ファームウェア：1 つのイメージに 3 つの Teach ツール、`image`（USB カメラ＋画像分類）、`voice`（声紋認識）、`sensor`（センサー分類）を収録し、起動時に Flash に保存されたモードで 1 つを選んで実行します。操作は IPRO AI Studio から行います。詳しい手順は [IPRO AI Teach](../teach/index.md) を参照してください"
        boards:
          zh: "Reef（`.config`）；`image` 模式需要 OV5640 相機"
          en: "Reef (`.config`); `image` mode needs the OV5640 camera"
          zh-cn: "Reef（`.config`）；`image` 模式需要 OV5640 摄像头"
          ja: "Reef（`.config`）、`image` モードには OV5640 カメラが必要"
        console:
          zh: "UART 115200"
          en: "UART 115200"
          zh-cn: "UART 115200"
          ja: "UART 115200"
        reef:
          zh: |
            這個韌體使用自己的分割表 `partition_reef_teach.toml`（韌體 640 KB、mfg 1364 KB），第一次燒錄時連同 mfg 資料（開機模式與聲紋模型）一起寫入。影像與感測器模型之後由 IPRO AI Studio 經 USB 部署。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/ai/ipro_reef_teach
                ```

                映像在 `apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin`（約 360 KB）。

            2. **產生 mfg 資料**：開機模式（此處為 `image`）與隨附的聲紋模型

                ```bash
                python3 apps/ai/ipro_reef_teach/mfg_payload.py \
                    --voice apps/ai/ipro_reef_teach/model/model_b.spkb --mode image -o reef_teach_mfg.bin
                ```

                在 SDK 根目錄產生 `reef_teach_mfg.bin`。

            3. **燒錄**：讓板子進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --skip-ota --pt <SDK>/apps/ai/ipro_reef_teach/partition_reef_teach.toml \
                    --firmware <SDK>/apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin \
                    --mfg <SDK>/reef_teach_mfg.bin
                ```

                確認輸出有 `[All Success]`，按一下 SW2。之後只更新韌體時拿掉 `--mfg`，模式與三個模型都會保留。

            4. **確認模式**：以 115200 baud 開啟主控台。開機訊息中的 `RTCH:   mode: image` 一行表示目前的模式。輸入 `mode voice`，板子約 2 秒後以聲紋模式重新開機，印出 `RTCH: voice ready`。

            </div>

            每個模式的 USB-C 識別碼不同（VID `0x3896`）：`image` 為 PID `0x0705`（UVC 相機＋序列埠），`voice` 為 `0x0720`、`sensor` 為 `0x0721`（序列埠）。不安裝 IPRO AI Studio 時，可以用瀏覽器版影像 Teach（`python3 tools/teach_web/serve.py`，以 Chrome 或 Edge 開啟 http://localhost:8780）。各模式的操作見 [IPRO AI Teach](../teach/index.md)。
          en: |
            This firmware has its own partition table, `partition_reef_teach.toml` (640 KB firmware, 1364 KB mfg). The first flash also writes the mfg payload: the boot mode and the voiceprint model. IPRO AI Studio deploys the image and sensor models over USB later.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/ai/ipro_reef_teach
                ```

                The image is `apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin` (about 360 KB).

            2. **Make the mfg payload**: the boot mode (`image` here) and the bundled voiceprint model

                ```bash
                python3 apps/ai/ipro_reef_teach/mfg_payload.py \
                    --voice apps/ai/ipro_reef_teach/model/model_b.spkb --mode image -o reef_teach_mfg.bin
                ```

                This writes `reef_teach_mfg.bin` in the SDK root.

            3. **Flash**: put the board in [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --skip-ota --pt <SDK>/apps/ai/ipro_reef_teach/partition_reef_teach.toml \
                    --firmware <SDK>/apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin \
                    --mfg <SDK>/reef_teach_mfg.bin
                ```

                Check for `[All Success]`, then press SW2. To update only the firmware later, leave out `--mfg`; the mode and all three models stay.

            4. **Check the mode**: open the console at 115200 baud. The boot line `RTCH:   mode: image` names the running mode. Type `mode voice`: the board restarts in voice mode in about 2 seconds and prints `RTCH: voice ready`.

            </div>

            Each mode has its own USB-C identity (VID `0x3896`): `image` is PID `0x0705` (UVC camera + serial port), `voice` `0x0720` and `sensor` `0x0721` (serial port). Without IPRO AI Studio, the image tool also runs in a browser: `python3 tools/teach_web/serve.py`, then open http://localhost:8780 in Chrome or Edge. Each mode is walked through in [IPRO AI Teach](../teach/index.md).
          zh-cn: |
            这个固件使用自己的分区表 `partition_reef_teach.toml`（固件 640 KB、mfg 1364 KB），首次烧录时连同 mfg 数据（启动模式与声纹模型）一起写入。图像与传感器模型之后由 IPRO AI Studio 经 USB 部署。

            <div class="ipro-steps" markdown>

            1. **构建**

                ```bash
                make -C apps/ai/ipro_reef_teach
                ```

                镜像位于 `apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin`（约 360 KB）。

            2. **生成 mfg 数据**：启动模式（此处为 `image`）与随附的声纹模型

                ```bash
                python3 apps/ai/ipro_reef_teach/mfg_payload.py \
                    --voice apps/ai/ipro_reef_teach/model/model_b.spkb --mode image -o reef_teach_mfg.bin
                ```

                在 SDK 根目录生成 `reef_teach_mfg.bin`。

            3. **烧录**：让开发板进入[下载模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目录执行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --skip-ota --pt <SDK>/apps/ai/ipro_reef_teach/partition_reef_teach.toml \
                    --firmware <SDK>/apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin \
                    --mfg <SDK>/reef_teach_mfg.bin
                ```

                确认输出中有 `[All Success]`，按一下 SW2。之后只更新固件时去掉 `--mfg`，模式与三个模型都会保留。

            4. **确认模式**：以 115200 baud 打开控制台。启动信息中的 `RTCH:   mode: image` 一行表示当前的模式。输入 `mode voice`，开发板约 2 秒后以声纹模式重启，打印 `RTCH: voice ready`。

            </div>

            每个模式的 USB-C 标识不同（VID `0x3896`）：`image` 为 PID `0x0705`（UVC 摄像头＋串口），`voice` 为 `0x0720`、`sensor` 为 `0x0721`（串口）。不安装 IPRO AI Studio 时，可以使用浏览器版图像 Teach（`python3 tools/teach_web/serve.py`，用 Chrome 或 Edge 打开 http://localhost:8780）。各模式的操作见 [IPRO AI Teach](../teach/index.md)。
          ja: |
            このファームウェアは専用のパーティションテーブル `partition_reef_teach.toml`（ファームウェア 640 KB、mfg 1364 KB）を使用します。初回の書き込みでは mfg ペイロード（ブートモードと声紋モデル）も書き込みます。画像モデルとセンサーモデルは、あとから IPRO AI Studio が USB 経由でデプロイします。

            <div class="ipro-steps" markdown>

            1. **ビルド**

                ```bash
                make -C apps/ai/ipro_reef_teach
                ```

                イメージは `apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin`（約 360 KB）です。

            2. **mfg ペイロードの作成**：ブートモード（ここでは `image`）と付属の声紋モデルを含めます。

                ```bash
                python3 apps/ai/ipro_reef_teach/mfg_payload.py \
                    --voice apps/ai/ipro_reef_teach/model/model_b.spkb --mode image -o reef_teach_mfg.bin
                ```

                SDK のルートに `reef_teach_mfg.bin` が作成されます。

            3. **書き込み**：ボードを[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)にし、IntelProCube のディレクトリで次を実行します。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --skip-ota --pt <SDK>/apps/ai/ipro_reef_teach/partition_reef_teach.toml \
                    --firmware <SDK>/apps/ai/ipro_reef_teach/build/build_out/ipro_reef_teach_IPRO7.bin \
                    --mfg <SDK>/reef_teach_mfg.bin
                ```

                `[All Success]` を確認してから SW2 を押します。あとでファームウェアだけを更新する場合は `--mfg` を外します。モードと 3 つのモデルはすべて保持されます。

            4. **モードの確認**：115200 baud でコンソールを開きます。起動ログの `RTCH:   mode: image` の行が実行中のモードを示します。`mode voice` と入力すると、ボードは約 2 秒後に声紋モードで再起動し、`RTCH: voice ready` を表示します。

            </div>

            モードごとに USB-C の識別情報が異なります（VID `0x3896`）。`image` は PID `0x0705`（UVC カメラ＋シリアルポート）、`voice` は `0x0720`、`sensor` は `0x0721`（シリアルポート）です。IPRO AI Studio がなくても、画像ツールはブラウザーで動作します。`python3 tools/teach_web/serve.py` を実行し、Chrome または Edge で http://localhost:8780 を開いてください。各モードの手順は [IPRO AI Teach](../teach/index.md) で説明しています。
      - name: ipro_ble_remote
        path: apps/bluetooth/ble/ipro_ble_remote
        purpose:
          zh: "GATT 參考應用：LED、按鍵、環境、UART、相機影像與影像上傳服務；Reef 版另有 Reef 硬體服務與 BLE A/B OTA。隨附 Android 示範 App `ipro_remote_demo.apk`。教學見[第一個 BLE 應用](../tutorials/first-ble-app.md)"
          en: "GATT reference: LED, key, environment, UART, camera image and image upload services; the Reef build adds a Reef hardware service and BLE A/B OTA. Ships the Android demo app `ipro_remote_demo.apk`. Tutorial: [Your First BLE Application](../tutorials/first-ble-app.md)"
          zh-cn: "GATT 参考应用：LED、按键、环境、UART、摄像头图像与图像上传服务；Reef 版另有 Reef 硬件服务与 BLE A/B OTA。附带 Android 演示 App `ipro_remote_demo.apk`。教程见[第一个 BLE 应用](../tutorials/first-ble-app.md)"
          ja: "GATT リファレンス：LED、キー、環境、UART、カメラ画像、画像アップロードの各サービス。Reef 版では Reef ハードウェアサービスと BLE A/B OTA が加わります。Android デモアプリ `ipro_remote_demo.apk` が付属します。チュートリアル：[最初の BLE アプリケーション](../tutorials/first-ble-app.md)"
        boards:
          zh: "Reef（`defconfig_reef`：WS2812、相機、SD 卡、音訊與 BLE A/B OTA）；`.config`、`defconfig` 為 IPRO7 EVB"
          en: "Reef (`defconfig_reef`: WS2812, camera, SD card, audio and BLE A/B OTA); `.config` and `defconfig` target the IPRO7 EVB"
          zh-cn: "Reef（`defconfig_reef`：WS2812、摄像头、SD 卡、音频与 BLE A/B OTA）；`.config`、`defconfig` 对应 IPRO7 EVB"
          ja: "Reef（`defconfig_reef`：WS2812、カメラ、SD カード、オーディオ、BLE A/B OTA）、`.config` と `defconfig` は IPRO7 EVB 用"
        console:
          zh: "UART 115200"
          en: "UART 115200"
          zh-cn: "UART 115200"
          ja: "UART 115200"
        build:
          zh: "Reef：`make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef`"
          zh-cn: "Reef：`make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef`"
          ja: "Reef：`make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef`"
        reef:
          zh: |
            Reef 版使用 boot2 與 A/B 分割表 `partition_cfg_2M_remote_ab.toml`，才能做 BLE OTA。第一次燒錄要連同 boot2 一起寫入；boot2 映像隨 IntelProCube 提供，不在 SDK 內。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin`。只執行 `make`（不加 `DEFCONFIG=`）建置的是 IPRO7 EVB 版。

            2. **第一次燒錄**：進入[下載模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目錄執行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --boot2 chips/ipro7/builtin_imgs/boot2_v0.6.0/ipro_boot2_IPRO7_v0.6.0.bin \
                    --pt <SDK>/apps/bluetooth/ble/ipro_ble_remote/partition_cfg_2M_remote_ab.toml \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin
                ```

                確認 `[All Success]` 後按一下 SW2。

            3. **執行**：以 115200 baud 開啟主控台。開機訊息先出現 `[BOOT2] IPRO7 Boot2 v0.6.0`，接著是 `[BLE] Advertising: IPRO-Remote`。以手機的 nRF Connect 或 `ipro_remote_demo.apk` 連線到 `IPRO-Remote`；主控台輸入 `reef status` 查看板卡、相機與 LED 狀態。

            4. **BLE OTA**：產生 OTA 套件並以 BLE 推送（主機需安裝 Python 套件 `bleak`）。打包腳本會使用 IntelProCube 資料夾裡最新的 boot2（0.7.0.1 為 v0.6.0）

                ```bash
                IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos sh apps/bluetooth/ble/ipro_ble_remote/tools/make_reef_ota.sh
                python3 apps/bluetooth/ble/ipro_ble_remote/tools/reef_ota.py \
                    apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_reef.xz.ota
                ```

                套件約 345 KB，傳完後板子重新開機，從新映像啟動。

            </div>

            !!! warning "OTA 只用 A/B 分割表"
                不要在 Reef 上以標準的 `partition_cfg_2M.toml` 做 OTA：寫入它的 FW B 並切換後，板子沒有任何輸出，只能進下載模式重新燒錄。
          en: |
            The Reef build uses boot2 and the A/B partition table `partition_cfg_2M_remote_ab.toml`, which BLE OTA needs. The first flash writes boot2 too; the boot2 image comes with IntelProCube, not with the SDK.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef
                ```

                The image is `apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin`. A plain `make` (no `DEFCONFIG=`) builds the IPRO7 EVB version.

            2. **First flash**: enter [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --boot2 chips/ipro7/builtin_imgs/boot2_v0.6.0/ipro_boot2_IPRO7_v0.6.0.bin \
                    --pt <SDK>/apps/bluetooth/ble/ipro_ble_remote/partition_cfg_2M_remote_ab.toml \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin
                ```

                Check for `[All Success]`, then press SW2.

            3. **Run**: open the console at 115200 baud. The boot log starts with `[BOOT2] IPRO7 Boot2 v0.6.0`, then shows `[BLE] Advertising: IPRO-Remote`. Connect to `IPRO-Remote` with nRF Connect or `ipro_remote_demo.apk` on a phone; `reef status` at the console shows the board, camera and LED state.

            4. **BLE OTA**: build the OTA package and push it over BLE (the host needs the Python package `bleak`). The packaging script takes the newest boot2 in the IntelProCube folder (v0.6.0 in 0.7.0.1):

                ```bash
                IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos sh apps/bluetooth/ble/ipro_ble_remote/tools/make_reef_ota.sh
                python3 apps/bluetooth/ble/ipro_ble_remote/tools/reef_ota.py \
                    apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_reef.xz.ota
                ```

                The package is about 345 KB; when it is in, the board restarts from the new image.

            </div>

            !!! warning "OTA needs the A/B table"
                Never OTA a Reef that was flashed with the stock `partition_cfg_2M.toml`: after an update is written to its FW B and selected, the board prints nothing and has to be reflashed from download mode.
          zh-cn: |
            Reef 版使用 boot2 与 A/B 分区表 `partition_cfg_2M_remote_ab.toml`，才能进行 BLE OTA。首次烧录要连同 boot2 一起写入；boot2 镜像随 IntelProCube 提供，不在 SDK 内。

            <div class="ipro-steps" markdown>

            1. **构建**

                ```bash
                make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef
                ```

                镜像位于 `apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin`。只执行 `make`（不加 `DEFCONFIG=`）构建的是 IPRO7 EVB 版。

            2. **首次烧录**：进入[下载模式](../hardware/boards/reef-evk.md#download-mode)，在 IntelProCube 目录执行

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --boot2 chips/ipro7/builtin_imgs/boot2_v0.6.0/ipro_boot2_IPRO7_v0.6.0.bin \
                    --pt <SDK>/apps/bluetooth/ble/ipro_ble_remote/partition_cfg_2M_remote_ab.toml \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin
                ```

                确认 `[All Success]` 后按一下 SW2。

            3. **运行**：以 115200 baud 打开控制台。启动信息先出现 `[BOOT2] IPRO7 Boot2 v0.6.0`，接着是 `[BLE] Advertising: IPRO-Remote`。用手机上的 nRF Connect 或 `ipro_remote_demo.apk` 连接 `IPRO-Remote`；在控制台输入 `reef status` 查看开发板、摄像头与 LED 状态。

            4. **BLE OTA**：生成 OTA 包并通过 BLE 推送（主机需安装 Python 包 `bleak`）。打包脚本会使用 IntelProCube 文件夹里最新的 boot2（0.7.0.1 为 v0.6.0）

                ```bash
                IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos sh apps/bluetooth/ble/ipro_ble_remote/tools/make_reef_ota.sh
                python3 apps/bluetooth/ble/ipro_ble_remote/tools/reef_ota.py \
                    apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_reef.xz.ota
                ```

                OTA 包约 345 KB，传输完成后开发板重启，从新镜像启动。

            </div>

            !!! warning "OTA 只能使用 A/B 分区表"
                不要在 Reef 上以标准的 `partition_cfg_2M.toml` 进行 OTA：写入其 FW B 并切换后，开发板没有任何输出，只能进入下载模式重新烧录。
          ja: |
            Reef 版は boot2 と A/B パーティションテーブル `partition_cfg_2M_remote_ab.toml` を使用します。BLE OTA にはこれが必要です。初回の書き込みでは boot2 も書き込みます。boot2 イメージは SDK ではなく IntelProCube に付属しています。

            <div class="ipro-steps" markdown>

            1. **ビルド**

                ```bash
                make -C apps/bluetooth/ble/ipro_ble_remote DEFCONFIG=defconfig_reef
                ```

                イメージは `apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin` です。`DEFCONFIG=` を付けずに `make` だけを実行すると、IPRO7 EVB 版がビルドされます。

            2. **初回の書き込み**：[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)に入り、IntelProCube のディレクトリで次を実行します。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --boot2 chips/ipro7/builtin_imgs/boot2_v0.6.0/ipro_boot2_IPRO7_v0.6.0.bin \
                    --pt <SDK>/apps/bluetooth/ble/ipro_ble_remote/partition_cfg_2M_remote_ab.toml \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_IPRO7.bin
                ```

                `[All Success]` を確認してから SW2 を押します。

            3. **実行**：115200 baud でコンソールを開きます。起動ログは `[BOOT2] IPRO7 Boot2 v0.6.0` で始まり、続いて `[BLE] Advertising: IPRO-Remote` が表示されます。スマートフォンの nRF Connect または `ipro_remote_demo.apk` で `IPRO-Remote` に接続します。コンソールで `reef status` と入力すると、ボード、カメラ、LED の状態が表示されます。

            4. **BLE OTA**：OTA パッケージを作成し、BLE で送信します（ホストには Python パッケージ `bleak` が必要です）。パッケージ化スクリプトは IntelProCube フォルダー内の最新の boot2（0.7.0.1 では v0.6.0）を使います。

                ```bash
                IPRO_FLASH_TOOL=<ICUBE>/ipro_iot_tool_macos sh apps/bluetooth/ble/ipro_ble_remote/tools/make_reef_ota.sh
                python3 apps/bluetooth/ble/ipro_ble_remote/tools/reef_ota.py \
                    apps/bluetooth/ble/ipro_ble_remote/build_reef/build_out/ipro_ble_remote_reef.xz.ota
                ```

                パッケージは約 345 KB です。転送が完了するとボードが再起動し、新しいイメージから起動します。

            </div>

            !!! warning "OTA には A/B テーブルが必要"
                標準の `partition_cfg_2M.toml` で書き込んだ Reef には OTA を行わないでください。FW B に更新を書き込んで切り替えると、ボードは何も出力しなくなり、ダウンロードモードから書き込み直す必要があります。
      - name: ipro_throughput_test
        path: apps/bluetooth/ble/ipro_throughput_test
        purpose:
          zh: "兩板 BLE 吞吐量測試：1M／2M／Coded PHY、DLE、ATT MTU 247。教學見 [BLE 吞吐量測試](../tutorials/ble-throughput.md)"
          en: "Two-board BLE throughput test: 1M / 2M / Coded PHY, DLE, ATT MTU 247. Tutorial: [BLE Throughput Test](../tutorials/ble-throughput.md)"
          zh-cn: "双板 BLE 吞吐量测试：1M／2M／Coded PHY、DLE、ATT MTU 247。教程见 [BLE 吞吐量测试](../tutorials/ble-throughput.md)"
          ja: "2 枚のボードによる BLE スループットテスト：1M／2M／Coded PHY、DLE、ATT MTU 247。チュートリアル：[BLE スループットテスト](../tutorials/ble-throughput.md)"
        boards:
          zh: "兩塊 Reef（`defconfig_reef`）；`.config` 為 IPRO7 EVB"
          en: "Two Reefs (`defconfig_reef`); `.config` targets the IPRO7 EVB"
          zh-cn: "两块 Reef（`defconfig_reef`）；`.config` 对应 IPRO7 EVB"
          ja: "Reef 2 枚（`defconfig_reef`）、`.config` は IPRO7 EVB 用"
        console:
          zh: "UART 115200"
          en: "UART 115200"
          zh-cn: "UART 115200"
          ja: "UART 115200"
        build:
          zh: "Reef：`make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef`"
          en: "Reef: `make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef`"
          zh-cn: "Reef：`make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef`"
          ja: "Reef：`make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef`"
        reef:
          zh: |
            需要兩塊 Reef，各接一條主控台線。

            <div class="ipro-steps" markdown>

            1. **建置**

                ```bash
                make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef
                ```

                映像在 `apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin`。

            2. **燒錄兩塊板**：每塊板進入[下載模式](../hardware/boards/reef-evk.md#download-mode)後，在 IntelProCube 目錄執行（`--port` 換成該板的序列埠）

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin
                ```

                兩塊板都要看到 `[All Success]`，再各按一下 SW2。

            3. **執行**：以 115200 baud 各開一個主控台。重置約 7 秒後印出 `BLE initialized`。一塊板輸入 `tp slave`（以 `IPRO-TP-TEST` 廣播），另一塊輸入 `tp master`，等到 `Notifications enabled - ready for test`；在傳送端輸入 `tp phy 2` 與 `tp start 244 10`，10 秒後印出結果摘要。

            </div>
          en: |
            You need two Reefs, each with a console cable.

            <div class="ipro-steps" markdown>

            1. **Build**

                ```bash
                make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef
                ```

                The image is `apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin`.

            2. **Flash both boards**: put each board in [download mode](../hardware/boards/reef-evk.md#download-mode), then from the IntelProCube directory run (with that board's port)

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin
                ```

                Both boards must show `[All Success]`; then press SW2 on each.

            3. **Run**: open a console on each board at 115200 baud. About 7 seconds after reset each prints `BLE initialized`. Type `tp slave` on one board (it advertises as `IPRO-TP-TEST`) and `tp master` on the other, and wait for `Notifications enabled - ready for test`. On the sender type `tp phy 2` and `tp start 244 10`; the summary follows after 10 seconds.

            </div>
          zh-cn: |
            需要两块 Reef，各接一条控制台线。

            <div class="ipro-steps" markdown>

            1. **构建**

                ```bash
                make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef
                ```

                镜像位于 `apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin`。

            2. **烧录两块开发板**：每块开发板进入[下载模式](../hardware/boards/reef-evk.md#download-mode)后，在 IntelProCube 目录执行（`--port` 换成该开发板的串口）

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin
                ```

                两块开发板都要看到 `[All Success]`，再各按一下 SW2。

            3. **运行**：以 115200 baud 各打开一个控制台。复位约 7 秒后打印 `BLE initialized`。一块开发板输入 `tp slave`（以 `IPRO-TP-TEST` 广播），另一块输入 `tp master`，等到 `Notifications enabled - ready for test`；在发送端输入 `tp phy 2` 与 `tp start 244 10`，10 秒后打印结果摘要。

            </div>
          ja: |
            コンソールケーブルを接続した Reef が 2 枚必要です。

            <div class="ipro-steps" markdown>

            1. **ビルド**

                ```bash
                make -C apps/bluetooth/ble/ipro_throughput_test DEFCONFIG=defconfig_reef
                ```

                イメージは `apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin` です。

            2. **2 枚のボードへの書き込み**：各ボードを[ダウンロードモード](../hardware/boards/reef-evk.md#download-mode)にし、IntelProCube のディレクトリで次を実行します（ポートはそのボードのものを指定します）。

                ```bash
                ./ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \
                    --port /dev/cu.usbserial-XXXX --baudrate 921600 \
                    --firmware <SDK>/apps/bluetooth/ble/ipro_throughput_test/build_reef/build_out/ipro_throughput_test_IPRO7.bin
                ```

                両方のボードで `[All Success]` を確認してから、それぞれの SW2 を押します。

            3. **実行**：各ボードで 115200 baud のコンソールを開きます。リセットから約 7 秒後に、それぞれ `BLE initialized` を表示します。一方のボードで `tp slave` と入力し（`IPRO-TP-TEST` としてアドバタイズします）、もう一方で `tp master` と入力して、`Notifications enabled - ready for test` が表示されるまで待ちます。送信側で `tp phy 2` と `tp start 244 10` を入力すると、10 秒後に結果の概要が表示されます。

            </div>
