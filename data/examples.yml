# Shipped applications for the examples pages (tools/gen_examples.py).
# The catalog tables in examples/index.md and one page per app with a README are generated
# from this file and the app READMEs of the SDK release given with --sdk.
#
# readme.replace: regex substitutions applied to the README before publishing (each must
#   match at least once, so a rule that no longer applies fails loudly).
# readme.redline_ignore: rule ids whose matches on prose lines are accepted as reviewed.
# readme.exclude: true to publish catalog data only.
categories:
  - id: ble
    title: {zh: "BLE", en: "BLE"}
    apps:
      - name: ipro_ble_remote
        path: apps/bluetooth/ble/ipro_ble_remote
        purpose:
          zh: "GATT 參考應用：LED、按鍵、環境感測、UART、PIR 影像與影像上傳服務；隨附 Android 示範 App `ipro_remote_demo.apk`。教學見[第一個 BLE 應用](../tutorials/first-ble-app.md)"
          en: "GATT reference: LED, key, environment, UART, PIR image and image upload services; ships the Android demo app `ipro_remote_demo.apk`. Tutorial: [Your First BLE Application](../tutorials/first-ble-app.md)"
        boards:
          zh: "EVB（`.config`）；Reef（`defconfig_reef`：WS2812、相機、SD 卡、音訊與 BLE A/B OTA，需 boot2 與 `partition_cfg_2M_remote_ab.toml`）。`defconfig_lowpower` 需要控制器原始碼，無法以 V2.1.0 建置"
          en: "EVB (`.config`); Reef (`defconfig_reef`: WS2812, camera, SD card, audio and BLE A/B OTA; needs boot2 and `partition_cfg_2M_remote_ab.toml`). `defconfig_lowpower` needs the controller source and cannot be built from V2.1.0"
        console:
          zh: "UART 115200"
          en: "UART 115200"
      - name: ipro_ble_transparent
        path: apps/bluetooth/ble/ipro_ble_transparent
        purpose:
          zh: "UART／BLE 透明傳輸橋接，以 AT 指令設定；隨附設定的 AT 指令走 USB CDC"
          en: "UART-to-BLE transparent bridge configured with AT commands; in the shipped configuration the AT commands run over USB CDC"
        boards:
          zh: "EVB"
          en: "EVB"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        readme: {exclude: true}   # no README in the release
      - name: ipro_ble_hid_keyboard
        path: apps/bluetooth/ble/ipro_ble_hid_keyboard
        purpose:
          zh: "HID over GATT 鍵盤"
          en: "HID over GATT keyboard"
        boards:
          zh: "EVB"
          en: "EVB"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        readme: {exclude: true}   # no README in the release
      - name: ipro_throughput_test
        path: apps/bluetooth/ble/ipro_throughput_test
        purpose:
          zh: "兩板 BLE 吞吐量測試：1M／2M／Coded PHY、DLE、ATT MTU 247。教學見 [BLE 吞吐量測試](../tutorials/ble-throughput.md)"
          en: "Two-board BLE throughput test: 1M / 2M / Coded PHY, DLE, ATT MTU 247. Tutorial: [BLE Throughput Test](../tutorials/ble-throughput.md)"
        boards:
          zh: "EVB（`.config`）；Reef（`defconfig_reef`）"
          en: "EVB (`.config`); Reef (`defconfig_reef`)"
        console:
          zh: "UART 115200"
          en: "UART 115200"
        readme:
          # these lines say the old tool is retired, which is correct
          redline_ignore: [retired-tool]
      - name: ipro_le_audio_headset
        path: apps/bluetooth/le_audio/ipro_le_audio_headset
        purpose:
          zh: "LE Audio unicast 耳機：BAP unicast server、PACS、ASCS、VCP、CAP，LC3 解碼。教學見 [LE Audio 入門](../tutorials/le-audio.md)"
          en: "LE Audio unicast headset: BAP unicast server, PACS, ASCS, VCP, CAP, LC3 decoding. Tutorial: [Getting Started with LE Audio](../tutorials/le-audio.md)"
        boards:
          zh: "EVB（`.config`／`DAC.config`：DAC 輸出；`UAC.config`：USB Audio）；Reef（`defconfig_reef`）"
          en: "EVB (`.config` / `DAC.config`: DAC output; `UAC.config`: USB Audio); Reef (`defconfig_reef`)"
        console:
          zh: "UART 115200"
          en: "UART 115200"
  - id: audio
    title: {zh: "音訊與語音", en: "Audio and voice"}
    apps:
      - name: ipro_pdm_mic_demo
        path: apps/multimedia/ipro_pdm_mic_demo
        purpose:
          zh: "PDM 麥克風收音、DAC 播放、經 BLE 以 LC3 串流、SMP 配對、PDS31 休眠與綁定重連、2M 大量傳輸；Android 範例 App 原始碼在 `tools/android/IproMicDemo/`"
          en: "PDM microphone capture, DAC playback, LC3 streaming over BLE, SMP pairing, PDS31 sleep with bonded reconnect, 2M bulk transfer; the Android companion app's source is in `tools/android/IproMicDemo/`"
        boards:
          zh: "EVB（`.config`，`config_evb` 相同）；EVK（`make BOARD=evk`，使用 `config_evk`，另提供 16 kHz USB 麥克風）"
          en: "EVB (`.config`, same as `config_evb`); EVK (`make BOARD=evk`, uses `config_evk` and adds a 16 kHz USB microphone)"
        console:
          zh: "EVB：UART 115200<br>EVK：UART 921600"
          en: "EVB: UART 115200<br>EVK: UART 921600"
      - name: ipro_agora_sentino
        path: apps/multimedia/ipro_agora_sentino
        purpose:
          zh: "Sentino 雲端 AI 語音對話：BLE 配網、經 IPRO6S FIN 卡連 Wi-Fi、MQTT 登入、Agora RTC 即時語音。需另備 Sentino 裝置三元組與 AOSL（見 README）；FIN 卡端韌體未包含於 V2.1.0，請洽 INTELPRO"
          en: "Sentino cloud AI voice chat: BLE provisioning, Wi-Fi through the IPRO6S FIN card, MQTT login, Agora RTC voice. Needs a Sentino device triple and AOSL (see the README); the FIN card firmware is not included in V2.1.0, contact INTELPRO"
        boards:
          zh: "Reef（`.config`，`make` 或 `make BOARD=reef`）；EVK（`make BOARD=evk`，使用 `config_evk`，可建置但未經板上驗證）"
          en: "Reef (`.config`, `make` or `make BOARD=reef`); EVK (`make BOARD=evk`, uses `config_evk`; builds but is not verified on the board)"
        console:
          zh: "Reef：UART 115200<br>EVK：UART 921600"
          en: "Reef: UART 115200<br>EVK: UART 921600"
  - id: platform
    title: {zh: "平台與板卡", en: "Platform and boards"}
    apps:
      - name: ipro7_demo
        path: apps/platform/ipro7_demo
        purpose:
          zh: "全晶片參考：PWM、SPI、I2S、LCD、音訊 ADC／DAC、USB 裝置（CDC、HID、MSC、UAC、UVC）、檔案系統、TRNG 與 DSP 等，各有 shell 指令；BLE 示範預設關閉"
          en: "Full-chip reference: PWM, SPI, I2S, LCD, audio ADC / DAC, USB device (CDC, HID, MSC, UAC, UVC), file systems, TRNG, DSP and more, each with shell commands; the BLE demo is off by default"
        boards:
          zh: "EVB；另有 `defconfig_boot2`、`defconfig_boot2_nopsram`、`defconfig_boot2_ota`、`defconfig_nist_fulltest`、`defconfig_security_cert`"
          en: "EVB; also `defconfig_boot2`, `defconfig_boot2_nopsram`, `defconfig_boot2_ota`, `defconfig_nist_fulltest`, `defconfig_security_cert`"
        console:
          zh: "UART 115200"
          en: "UART 115200"
      - name: ipro7ai_evk_demo
        path: apps/platform/ipro7ai_evk_demo
        purpose:
          zh: "IPRO7AI EVK bring-up：LCD、相機、麥克風、喇叭與 SD 卡"
          en: "IPRO7AI EVK bring-up: LCD, camera, microphone, speaker and SD card"
        boards:
          zh: "EVK。`.config` 與 `config_video`：SD 卡影片播放，不含藍牙；`config_ai`：AI 與 NPU，不含藍牙；`config_bt`、`config_autoplay`：BLE 與 LE Audio unicast 接收，不含 AI"
          en: "EVK. `.config` and `config_video`: SD-card video playback, no Bluetooth; `config_ai`: AI and NPU, no Bluetooth; `config_bt`, `config_autoplay`: BLE and LE Audio unicast sink, no AI"
        console:
          zh: "`.config`：UART 921600<br>`config_*`：UART 115200"
          en: "`.config`: UART 921600<br>`config_*`: UART 115200"
        readme:
          replace:
            # the retired flashing tool, with a flash pin that is wrong for the EVK
            - pattern: 'tools/ipro_iot_tool_lite/ipro_iot_tool_lite --chipname ipro7 \\\n    --port (\S+) --baudrate 921600 --flash-pin 0x02 \\'
              repl: 'ipro_iot_tool_macos --chipname ipro7 --chip-variant IPRO7AI \\\n    --port \1 --baudrate 921600 \\'
            # drop the reference to a source file that is not in the release
            - {pattern: ', `\w+_isp\.c:\d+`', repl: ''}
      - name: ipro7ai_evk_launcher
        path: apps/platform/ipro7ai_evk_launcher
        purpose:
          zh: "相機、LCD、麥克風與喇叭整合在單一映像，以 NPU 辨識手勢切換頁面；人形／寵物偵測模型由 SD 卡 `sd:/models/person.inm` 載入；附 `flash.sh`"
          en: "Camera, LCD, microphone and speaker in one image, with pages switched by hand gestures recognized on the NPU; the person / pet detection model loads from the SD card as `sd:/models/person.inm`; ships `flash.sh`"
        boards:
          zh: "EVK"
          en: "EVK"
        console:
          zh: "UART 921600"
          en: "UART 921600"
      - name: ipro7ai_reef_demo
        path: apps/platform/ipro7ai_reef_demo
        purpose:
          zh: "Reef 開箱韌體：WS2812、按鍵、喇叭與耳機、PDM／耳機麥克風／AUX-IN、SD 卡、OV5640／OV2640 相機，各有 shell 指令"
          en: "Reef out-of-box firmware: WS2812, keys, speaker and headphones, PDM / headset microphone / AUX-IN, SD card, OV5640 / OV2640 camera, each with shell commands"
        boards:
          zh: "Reef（`.config`）；`defconfig_wifi_ipro6s`：經 IPRO6S FIN 卡連 Wi-Fi，並以 RTSP 串流相機畫面"
          en: "Reef (`.config`); `defconfig_wifi_ipro6s`: Wi-Fi through the IPRO6S FIN card plus an RTSP stream of the camera"
        console:
          zh: "UART 115200"
          en: "UART 115200"
