# English site, served at /ipro-sdk-docs/en/.
# Keep nav entries in the same order and files as mkdocs.zh.yml (tools/parity_check.py).
INHERIT: mkdocs.base.yml
site_url: https://intelpro-inc.github.io/ipro-sdk-docs/en/
site_description: INTELPRO IPRO SDK documentation
docs_dir: docs/en
