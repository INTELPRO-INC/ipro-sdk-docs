# IPRO SDK Documentation Site
# GitHub Pages Configuration

title: IPRO SDK
sdk_version: "v1.0.1"
description: A Comprehensive Software Development Kit for IPRO Hardware Platforms
baseurl: "/ipro-sdk-docs" # Your GitHub Pages repository name
url: "https://intelpro-inc.github.io" # Your GitHub Pages URL

# No theme: the site ships its own layout (_layouts/default.html) and CSS.
# A remote_theme would race our assets/css/style.css on incremental rebuilds.

# Build settings
markdown: kramdown
highlighter: rouge

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name

# Defaults
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: ""
    values:
      lang: "zh-TW"

# Navigation (Chinese) — single source of truth, rendered by _layouts/default.html.
# Top-level items: { title, url } = plain link, { title, dropdown: [...] } = dropdown menu.
nav:
  - title: 文件
    dropdown:
      - { title: 快速開始, desc: 環境設定與第一個專案, icon: fa-rocket, url: /getting-started }
      - { title: 教學, desc: 逐步開發教學, icon: fa-graduation-cap, url: /tutorials }
      - { title: 系統架構, desc: SDK 整體架構概覽, icon: fa-sitemap, url: /architecture }
      - { title: BLE 開發, desc: BLE 與 LE Audio, icon: fa-bluetooth-b, url: /ble-development }
      - { title: 應用範例, desc: 10 個參考應用程式, icon: fa-box, url: /applications }
      - { title: API 參考, desc: BLE、HAL、RTOS API, icon: fa-code, url: /api-reference }
  - title: 主題
    dropdown:
      - { title: 音訊與多媒體, desc: LE Audio、LC3、音訊管線, icon: fa-headphones, url: /audio-multimedia }
      - { title: 網路開發, desc: lwIP 與 IPRO6 連網擴充, icon: fa-network-wired, url: /wifi-networking }
      - { title: 工具與除錯, desc: 建構、燒錄、GDB, icon: fa-wrench, url: /tools-debugging }
      - { title: 硬體規格, desc: IPRO7 規格與腳位, icon: fa-microchip, url: /hardware }
      - { title: 更新日誌, desc: 版本發行紀錄, icon: fa-clock-rotate-left, url: /changelog }
  - title: 進階功能
    dropdown:
      - { title: AI 與 NPU, badge: Roadmap, desc: 端側 AI 推理, icon: fa-brain, url: /ai-npu }
      - { title: Matter & Thread, badge: Roadmap, desc: 智慧家庭協定, icon: fa-house-signal, url: /matter-thread }
      - { title: VS Code 擴充, badge: Roadmap, desc: IDE 開發整合, icon: fa-plug, url: /vscode-extension }
  - title: FAQ
    url: /faq

