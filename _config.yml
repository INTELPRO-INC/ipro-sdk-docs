# Languages
languages:
  zh-TW:
    name: 繁體中文
    flag: 🇹🇼
  en:
    name: English
    flag: 🇺🇸

# This site is documentation only, hosted on GitHub Pages

# Google Analytics (optional)
# google_analytics: UA-XXXXXXXX-X

# Site-wide release scope notice — rendered by _layouts/default.html below the navbar
release_notice: "本文件對應 IPRO SDK Release V1.0.1（2026-03-13）。IPRO7 不內建 Wi-Fi，可透過 IPRO6 companion 晶片（SDIO）擴充連網；進階功能（AI/NPU、Matter、Thread）未包含於此版本，如需取得請聯絡原廠。"
release_notice_en: "This documentation covers IPRO SDK Release V1.0.1 (2026-03-13). IPRO7 has no built-in Wi-Fi — network connectivity is available via the IPRO6 companion chip (SDIO). Advanced features (AI/NPU, Matter, Thread) are not included in this release; contact INTELPRO for availability."

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.md" # site pages are .html only; keeps stray notes out of the published site
